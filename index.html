<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مسابقه سبک زندگی سالم</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/Vazirmatn-font-face.css">
<style>
:root{--bg:#f3f7f4;--card:#fff;--tx:#1d2a23;--mu:#6b7a72;--ac:#2f9e6b;--ac2:#1f7a52;--bd:#e3e9e4}
@media(prefers-color-scheme:dark){:root{--bg:#111815;--card:#1b2520;--tx:#e8eee9;--mu:#93a39a;--ac:#4fb68a;--ac2:#2f9e6b;--bd:#2b3731}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0 auto;font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--tx);padding:12px 12px 90px;max-width:640px;line-height:1.7}
.hero{background:linear-gradient(135deg,#1f7a52,#4fb68a);color:#fff;border-radius:18px;padding:18px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;left:-30px;bottom:-40px;width:140px;height:140px;border-radius:50%;background:#ffffff22}
.hero h1{margin:2px 0;font-size:1.35em}.mu2{opacity:.85;font-size:.85em}
button.ghost{background:#ffffff26;color:#fff;border:0;position:relative;z-index:1}
.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 1px 3px #0000000a}
button,input,select{font:inherit;padding:10px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
button{cursor:pointer;transition:transform .12s,box-shadow .12s,opacity .2s}
button:active{transform:scale(.94)}
button.p{background:var(--ac);color:#fff;border:0;box-shadow:0 3px 0 var(--ac2)}
button.p:active{box-shadow:0 0 0 var(--ac2);transform:translateY(3px) scale(.98)}
button.big{width:100%;padding:14px;font-weight:700;font-size:1.05em}
.busy{pointer-events:none;opacity:.8;position:relative;color:transparent!important}
.busy::after{content:"";position:absolute;inset:0;margin:auto;width:18px;height:18px;border:2.5px solid #fff;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
input{width:100%;margin:5px 0}
.mu{color:var(--mu);font-size:.9em}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.ch{display:flex;align-items:center;gap:10px;padding:10px;border:1.5px solid var(--bd);border-radius:14px;margin:8px 0;cursor:pointer;transition:.15s}
.ch:has(input:checked){border-color:var(--ac);background:color-mix(in srgb,var(--ac) 10%,transparent)}
.ch input{appearance:none;-webkit-appearance:none;width:26px;height:26px;margin:0;padding:0;border-radius:50%;border:2px solid var(--bd);display:grid;place-items:center;flex:none}
.ch input:checked{background:var(--ac);border-color:var(--ac)}.ch input:checked::after{content:"✓";color:#fff;font-size:15px;line-height:1}
.ct{flex:1}.ct small{display:block;color:var(--mu)}.pt{color:var(--ac)}
.ib{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.chip{background:var(--bd);border-radius:20px;padding:3px 10px;margin-inline-end:6px;font-size:.85em}.sum{color:var(--ac)}
.stat{display:flex;gap:16px;align-items:center}.big2{font-size:1.5em;font-weight:700}.big2 small{font-size:.5em;color:var(--mu);font-weight:400}
.ring{width:76px;height:76px;border-radius:50%;flex:none;background:conic-gradient(var(--ac) calc(var(--p)*1%),var(--bd) 0);display:grid;place-items:center;position:relative}
.ring::before{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--card)}.ring b{position:relative;font-size:.9em}
.tabs{position:fixed;bottom:0;inset-inline:0;display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:0;font-size:.75em;color:var(--mu);padding:4px 14px}.tabs .on{color:var(--ac);font-weight:700}
.toast{position:fixed;top:12px;inset-inline:12px;max-width:560px;margin:auto;z-index:9;padding:12px 14px;border-radius:12px;animation:fade 4.5s forwards;box-shadow:0 6px 20px #0003;pointer-events:none}
@keyframes fade{0%,85%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-8px);visibility:hidden}}
.logo{font-size:2.6em;text-align:center}.login{text-align:center;margin-top:12vh}.login input{text-align:left}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.85em}td,th{padding:7px 5px;text-align:center;border-bottom:1px solid var(--bd);white-space:nowrap}
tr.me td{background:color-mix(in srgb,var(--ac) 12%,transparent);font-weight:700}
.msg{padding:8px;border-radius:8px;margin:8px 0}.err{background:#fde8e8;color:#8a1f1f}.ok{background:#e3f4ea;color:#1b5e3b}
</style></head><body>
<div id="app"><div class="c">در حال بارگذاری…</div></div>
<script>
// ===== تنظیمات: این دو مقدار را از Supabase (Project Settings > API) بگذارید =====
const SUPABASE_URL = "https://ekmiynpjugfqdnwfofgn.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVrbWl5bnBqdWdmcWRud2ZvZmduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzNjU1MTcsImV4cCI6MjEwNzk0MTUxN30.6i1LKuj9KUbJAJ916Yo7AOC-_VtftDpVhdDEeR8f5LA";
// ==============================================================================
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = s => document.querySelector(s), fa = n => Number(n).toLocaleString('fa-IR');
const DAY = 864e5, ms = s => Date.parse(s + 'T00:00:00Z'), str = m => new Date(m).toISOString().slice(0, 10);
const addDays = (s, n) => str(ms(s) + n * DAY);
const weekStart = s => addDays(s, -((new Date(ms(s)).getUTCDay() + 1) % 7));
const todayIn = tz => new Intl.DateTimeFormat('en-CA', {timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit'}).format(new Date());
const fd = (s, o) => new Date(ms(s)).toLocaleDateString('fa-IR', {timeZone: 'UTC', ...o});
const S = {tab: 'submit', msg: null};

function msg(t, ok) { S.msg = {t, ok}; }
function msgHtml() { const m = S.msg; S.msg = null; return m ? `<div class="msg ${m.ok ? 'ok' : 'err'}">${m.t}</div>` : ''; }
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const active = pw => S.ch.filter(c => c.is_active && c.start_week <= pw);
const sum = a => a.reduce((s, c) => s + c.base_points, 0);
const thr = pw => { const t = sum(active(pw)); return Math.round((t + Math.round(t * .2)) * 7 * .8); };

async function load() {
  const {data: {session}} = await sb.auth.getSession();
  if (!session) return loginView();
  const [p, ch, st, wk] = await Promise.all([
    sb.from('profiles').select('*').eq('id', session.user.id).single(),
    sb.from('challenges').select('*').order('id'),
    sb.from('game_settings').select('tz').single(),
    sb.from('calendar_weeks').select('*').order('week_number')]);
  if (p.error || ch.error) { msg('خطا در دریافت اطلاعات: ' + (p.error || ch.error).message); return loginView(); }
  Object.assign(S, {me: p.data, ch: ch.data, tz: st.data.tz, weeks: wk.data, uid: session.user.id});
  S.today = todayIn(S.tz); S.date = addDays(S.today, -1);
  const sub = await sb.from('submissions').select('challenge_id,completed').eq('member_id', S.uid).eq('activity_date', S.date);
  S.done = new Set((sub.data || []).filter(r => r.completed).map(r => r.challenge_id));
  S.saved = (sub.data || []).length > 0;
  render();
}

function loginView() {
  $('#app').innerHTML = `<div class="c"><div class="logo">🌿</div><h2>مسابقه سبک زندگی سالم</h2><p class="mu">برای ورود، ایمیل و رمز عبور خود را وارد کنید</p>${msgHtml()}
  <input id="em" type="email" placeholder="ایمیل" dir="ltr"><input id="pw" type="password" placeholder="رمز عبور" dir="ltr">
  <button class="p" onclick="login()">ورود</button></div>`;
}
async function login() {
  const {error} = await sb.auth.signInWithPassword({email: $('#em').value.trim(), password: $('#pw').value});
  if (error) { msg('ایمیل یا رمز عبور درست نیست.'); return loginView(); }
  load();
}
async function logout() { await sb.auth.signOut(); load(); }

const ICON = {
  'تغذیه': ['#2f9e6b', '<path d="M12 8c-2.5-2.5-7-1-7 4 0 4 3 8 7 8s7-4 7-8c0-5-4.5-6.5-7-4z"/><path d="M12 8c0-2.5 1-4 3.5-5"/>'],
  'فعالیت بدنی': ['#e8833a', '<path d="M3 12h4l3-8 4 16 3-8h4"/>'],
  'آرامش روحی': ['#7c5cc4', '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>']};
const svg = (p, c = 'currentColor', n = 22) => `<svg width="${n}" height="${n}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const chIcon = cat => { const [c, p] = ICON[cat] || ['#888', '']; return `<span class="ib" style="background:${c}22">${svg(p, c)}</span>`; };
const TABI = {submit: '<path d="M5 12l5 5L20 7"/>', board: '<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>',
  hist: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', admin: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'};
// حالت «در حال انجام» برای دکمه‌ها + جلوگیری از کلیک دوباره
document.addEventListener('click', e => {
  const b = e.target.closest('button.p, button[data-b]');
  if (!b) return;
  if (b.classList.contains('busy')) { e.stopPropagation(); e.preventDefault(); return; }
  b.classList.add('busy'); setTimeout(() => b.classList.remove('busy'), 12000);
}, true);
function streakOf(d) { let i = S.date, n = 0; if (!d[i]) i = addDays(i, -1); while (d[i]?.all_completed) { n++; i = addDays(i, -1); } return n; }

function render() {
  const tabs = [['submit', 'ثبت فعالیت'], ['board', 'لیدربورد'], ['hist', 'تاریخچه']];
  if (S.me.role === 'admin') tabs.push(['admin', 'مدیریت']);
  const m = S.msg; S.msg = null;
  $('#app').innerHTML = (m ? `<div class="toast msg ${m.ok ? 'ok' : 'err'}">${m.t}</div>` : '') +
  `<div class="hero"><div><div class="mu2">${fd(S.today, {weekday: 'long', day: 'numeric', month: 'long'})}</div><h1>سلام ${esc(S.me.display_name)} 👋</h1><div class="mu2">هفته پیشرفت ${fa(S.me.progress_week)}</div></div><button class="ghost" data-b onclick="logout()">خروج</button></div>
  <div id="main"><div class="c">در حال بارگذاری…</div></div>
  <nav class="tabs">${tabs.map(([k, v]) => `<button class="${S.tab === k ? 'on' : ''}" onclick="S.tab='${k}';render()">${svg(TABI[k])}<span>${v}</span></button>`).join('')}</nav>`;
  ({submit: submitView, board: boardView, hist: histView, admin: adminView})[S.tab]();
}

function submitView() {
  const a = active(S.me.progress_week);
  $('#main').innerHTML = `<div id="sum"></div><div class="c"><div class="mu">فعالیت‌های روز <b>${fd(S.date, {weekday: 'long', day: 'numeric', month: 'long'})}</b></div>
  ${a.map(c => `<label class="ch"><input type="checkbox" value="${c.id}" ${S.done.has(c.id) ? 'checked' : ''} onchange="tot()">${chIcon(c.category)}<span class="ct">${esc(c.title)}<small>${c.category}</small></span><b class="pt">+${fa(c.base_points)}</b></label>`).join('')}
  <p id="tot"></p><button class="p big" onclick="save()">${S.saved ? 'اصلاح ثبت' : 'ثبت فعالیت'}</button></div>`;
  tot(); summary();
}
function tot() {
  const a = active(S.me.progress_week), ck = [...document.querySelectorAll('.ch input:checked')].map(i => i.value);
  const done = a.filter(c => ck.includes(c.id)), base = sum(done), all = a.length && done.length === a.length;
  const bonus = all ? Math.round(sum(a) * .2) : 0;
  $('#tot').innerHTML = `<span class="chip">پایه ${fa(base)}</span><span class="chip">پاداش ${fa(bonus)}</span><b class="sum">مجموع ${fa(base + bonus)}</b>`;
}
async function summary() {
  const {data} = await sb.from('daily_scores').select('activity_date,daily_total,all_challenges_completed').eq('member_id', S.uid).gte('activity_date', addDays(S.today, -60));
  const d = {}; (data || []).forEach(r => d[r.activity_date] = r);
  const ws = weekStart(S.today), score = [...Array(7)].reduce((t, _, i) => t + (d[addDays(ws, i)]?.daily_total || 0), 0);
  const th = thr(S.me.progress_week), pct = th ? Math.min(100, Math.round(score / th * 100)) : 0;
  const el = $('#sum'); if (!el) return;
  el.innerHTML = `<div class="c stat"><div class="ring" style="--p:${pct}"><b>${fa(pct)}٪</b></div><div><div class="mu">امتیاز این هفته</div><div class="big2">${fa(score)} <small>از حد نصاب ${fa(th)}</small></div><div class="mu">🔥 تداوم روزهای کامل: <b>${fa(streakOf(d))}</b></div></div></div>`;
}
async function save() {
  const a = active(S.me.progress_week), ck = [...document.querySelectorAll('.ch input:checked')].map(i => i.value);
  const {error} = await sb.rpc('submit_yesterday', {p_done: ck});
  const all = a.length && a.every(c => ck.includes(c.id));
  msg(error ? 'ثبت انجام نشد: ' + error.message : all ? 'آفرین! روز کامل با پاداش ثبت شد 🎉' : 'ثبت شد ✅', !error);
  load();
}

async function boardView() {
  const from = addDays(S.today, -60), {data, error} = await sb.rpc('get_scores', {p_from: from});
  if (error) { $('#main').innerHTML = `<div class="msg err">${error.message}</div>`; return; }
  const ws = weekStart(S.today), days = [...Array(7)].map((_, i) => addDays(ws, i)), by = {};
  data.forEach(r => { (by[r.member_id] ??= {id: r.member_id, name: r.name, pw: r.progress_week, d: {}}); if (r.activity_date) by[r.member_id].d[r.activity_date] = r; });
  const rows = Object.values(by).map(m => {
    const score = days.reduce((s, d) => s + (m.d[d]?.daily_total || 0), 0);
    return {...m, score, streak: streakOf(m.d), ok: score >= thr(m.pw)};
  }).sort((a, b) => b.score - a.score);
  rows.forEach((r, i) => r.rank = i && r.score === rows[i - 1].score ? rows[i - 1].rank : i + 1);
  const wn = S.weeks.find(w => w.start_date === ws);
  $('#main').innerHTML = `<div class="c"><div class="mu">هفته ${wn ? fa(wn.week_number) : ''} بازی — ${fd(ws, {day: 'numeric', month: 'long'})} تا ${fd(addDays(ws, 6), {day: 'numeric', month: 'long'})}</div>
  <div class="w"><table><tr><th>رتبه</th><th>نام</th>${days.map(d => `<th>${fd(d, {weekday: 'short'})}</th>`).join('')}<th>جمع</th><th>🔥</th><th>وضعیت</th></tr>
  ${rows.map(r => `<tr class="${r.id === S.uid ? 'me' : ''}"><td>${['🥇', '🥈', '🥉'][r.rank - 1] || fa(r.rank)}</td><td>${esc(r.name)}</td>${days.map(d => `<td>${r.d[d] ? fa(r.d[d].daily_total) : ''}</td>`).join('')}<td><b>${fa(r.score)}</b></td><td>${fa(r.streak)}</td><td>${r.ok ? 'حد نصاب تکمیل شد' : 'در حال پیشرفت'}</td></tr>`).join('')}</table></div>
  <button data-b onclick="boardView()">به‌روزرسانی</button></div>`;
}

async function histView() {
  const {data, error} = await sb.from('daily_scores').select('*').eq('member_id', S.uid).order('activity_date', {ascending: false}).limit(60);
  const w = (await sb.from('weekly_results').select('*').eq('member_id', S.uid).order('calendar_week_id', {ascending: false})).data || [];
  $('#main').innerHTML = error ? `<div class="msg err">${error.message}</div>` : `<div class="c"><h3>امتیاز روزانه</h3>${data.length ? data.map(r => `<div class="row"><span>${fd(r.activity_date, {weekday: 'long', day: 'numeric', month: 'long'})}${r.all_challenges_completed ? ' ✅' : ''}</span><span class="mu">پایه ${fa(r.base_score)} + پاداش ${fa(r.bonus)} = <b>${fa(r.daily_total)}</b></span></div>`).join('') : '<p class="mu">هنوز چیزی ثبت نشده.</p>'}
  ${w.length ? '<h3>نتیجه هفته‌ها</h3>' + w.map(r => `<div class="row"><span>هفته پیشرفت ${fa(r.progress_week)}</span><span class="mu">${fa(r.total_score)} از ${fa(r.weekly_threshold)} — ${r.result_status}</span></div>`).join('') : ''}</div>`;
}

const CATS = ['تغذیه', 'فعالیت بدنی', 'آرامش روحی'];
function chRow(c) {
  return `<div class="c"><div class="row" style="border:0;padding:0">${chIcon(c.category)}<input id="t_${c.id}" value="${esc(c.title)}"></div>
  <div class="row" style="border:0"><select id="k_${c.id}">${CATS.map(k => `<option ${k === c.category ? 'selected' : ''}>${k}</option>`).join('')}</select>
  <label>امتیاز <input id="p_${c.id}" type="number" min="1" value="${c.base_points}" style="width:70px"></label>
  <label>هفته شروع <input id="s_${c.id}" type="number" min="1" value="${c.start_week}" style="width:70px"></label></div>
  <label><input type="checkbox" id="a_${c.id}" style="width:auto" ${c.is_active ? 'checked' : ''}> فعال</label>
  <button class="p" onclick="saveCh('${c.id}')">ذخیره</button></div>`;
}
function adminView() {
  const closable = S.weeks.filter(w => w.status !== 'closed' && w.end_date < S.today);
  $('#main').innerHTML = `<div class="c"><h3>چالش‌ها</h3>
  <p class="mu">«هفته شروع» یعنی هفته پیشرفت: چالشی با هفته شروع ۳ برای اعضایی فعال می‌شود که به هفته پیشرفت ۳ برسند. تغییر امتیاز یا غیرفعال‌کردن وسط هفته، حد نصاب را عوض می‌کند؛ بهتر است بین هفته‌ها انجام شود. ثبت‌های قبلی تغییر نمی‌کنند.</p></div>
  ${S.ch.map(chRow).join('')}
  <div class="c"><h3>چالش جدید</h3><input id="nt" placeholder="عنوان">
  <select id="nk">${CATS.map(k => `<option>${k}</option>`).join('')}</select>
  <input id="np" type="number" min="1" placeholder="امتیاز"><input id="ns" type="number" min="1" placeholder="هفته شروع (هفته پیشرفت)">
  <button class="p" onclick="addCh()">افزودن</button></div>
  <div class="c"><h3>بستن هفته و ارتقای اعضا</h3>
  ${closable.length ? `<select id="cw">${closable.map(w => `<option value="${w.id}">هفته ${fa(w.week_number)} (${fd(w.start_date, {day: 'numeric', month: 'long'})})</option>`).join('')}</select>
  <button class="p" onclick="closeWeek()">بستن هفته</button>` : '<p class="mu">هفته‌ای که تمام شده و بسته نشده باشد وجود ندارد.</p>'}
  <p class="mu">اصلاح ثبت‌های گذشته و خروجی CSV در نسخه بعد اضافه می‌شوند.</p></div>`;
}
function chVals(p, id) {
  const g = x => $('#' + x + '_' + id), t = (id === 'new' ? $('#nt') : g('t')).value.trim();
  const k = id === 'new' ? $('#nk').value : g('k').value;
  const pts = +(id === 'new' ? $('#np') : g('p')).value, sw = +(id === 'new' ? $('#ns') : g('s')).value;
  if (!t || !Number.isInteger(pts) || pts < 1 || !Number.isInteger(sw) || sw < 1) return null;
  return {title: t, category: k, base_points: pts, start_week: sw};
}
async function saveCh(id) {
  const v = chVals(0, id); if (!v) { msg('عنوان، امتیاز و هفته شروع را درست وارد کنید.'); return load(); }
  const {error} = await sb.from('challenges').update({...v, is_active: $('#a_' + id).checked, updated_at: new Date().toISOString()}).eq('id', id);
  msg(error ? error.message : 'ذخیره شد ✅', !error); load();
}
async function addCh() {
  const v = chVals(0, 'new'); if (!v) { msg('عنوان، امتیاز و هفته شروع را درست وارد کنید.'); return load(); }
  const n = Math.max(0, ...S.ch.map(c => parseInt(c.id.slice(1)) || 0)) + 1;
  const {error} = await sb.from('challenges').insert({id: 'C' + String(n).padStart(3, '0'), ...v});
  msg(error ? error.message : 'چالش اضافه شد ✅', !error); load();
}
async function closeWeek() {
  const {error} = await sb.rpc('close_week', {p_week: +$('#cw').value});
  msg(error ? error.message : 'هفته بسته شد و ارتقاها اعمال شد.', !error); load();
}
sb.auth.onAuthStateChange(() => {}); load();
</script></body></html>
