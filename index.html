function toGreg(y, m, d) {

function resizeImg(file, max = 256, type = 'image/jpeg') {
  return new Promise((res, rej) => {
    const r = new FileReader(); r.onerror = rej;
    r.onload = () => {
      const im = new Image(); im.onerror = rej;
      im.onload = () => {
        const k = Math.min(1, max / Math.max(im.width, im.height));
        const c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL(type, .85));
      };
      im.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

async function consumeJoin() {
  const t = localStorage.getItem('wcd_join'); if (!t) return;
  localStorage.removeItem('wcd_join');
  const {error} = await sb.rpc('join_by_invite', {p_token: t});
  if (error) notify('لینک دعوت: ' + error.message, false); else notify('به لیگ اضافه شدید ✅');

  if (p.error || !p.data) { await sb.auth.signOut(); return authView('login'); }
  if (p.data.status !== 'active') { await sb.auth.signOut(); return authView('login'); }

  const {error} = await sb.auth.signInWithPassword({email: emailOf(ph), password: PW(pin)});
  if (error) return notify('شماره موبایل یا رمز ورود اشتباه است', false);
  boot();
}

/* ---------- باز کردن یک لیگ ---------- */
async function openWs(id, tab) {
  const {data: w, error} = await sb.from('workspaces').select('*').eq('id', id).single();
  if (error || !w) return notify('این لیگ در دسترس نیست', false);
  const m = S.mships.find(x => x.workspace_id === id) || null;
  S.ws = w; S.wid = id; S.edit = null;
  S.isMember = !!m && m.status === 'active';
  S.mode = S.isMember ? 'member' : (m ? 'archive' : 'guest');
  S.isAdmin = S.isSuper || (S.isMember && m.role === 'admin');
  S.pw = m?.progress_week || 1;
  S.today = todayIn(w.tz);
  const [ch, wk, sub] = await Promise.all([
    sb.from('challenges').select('*').eq('workspace_id', id).order('id'),
    sb.from('calendar_weeks').select('*').eq('workspace_id', id).order('week_number'),
    S.isMember ? sb.from('submissions').select('challenge_id,completed').eq('workspace_id', id).eq('member_id', S.uid).eq('activity_date', S.today) : Promise.resolve({data: []})]);
  if (ch.error || wk.error) return notify('خطا در دریافت اطلاعات لیگ', false);
  S.ch = ch.data || []; S.weeks = wk.data || [];
  S.done = new Set((sub.data || []).filter(r => r.completed).map(r => r.challenge_id));
  S.saved = (sub.data || []).length > 0;
  S.tab = tab || (S.mode === 'archive' ? 'hist' : S.isMember ? 'submit' : 'board');
  render();
}
function reload() { return openWs(S.wid, S.tab); }

/* ---------- قاب لیگ ---------- */

  if (S.mode === 'member') tabs.push(['submit', 'ثبت امروز'], ['board', 'لیگ'], ['hist', 'تاریخچه'], ['profile', 'پروفایل']);
  else if (S.mode === 'archive') tabs.push(['hist', 'سوابق']);

  <span style="margin-inline-start:auto;display:flex;gap:6px">${installBtn()}<button class="ghost2 small" onclick="wsListView()">⇄ لیگ‌ها</button></span></div>
  <div class="hero"><div><div class="mu2">${fd(S.today, {weekday: 'long', day: 'numeric', month: 'long'})}</div>
  <h1>سلام ${esc(S.me.display_name)} 👋</h1>${S.mode === 'member' ? `<div class="mu2">چالش هفته ${fa(S.pw)}</div>` : ''}</div>
  <button class="ghost" data-b onclick="logout()">خروج</button></div>

function go(k) { S.tab = k; if (k !== 'profile') S.viewId = null; S.edit = null; render(); }
function openProfile(id) { S.viewId = id; go('profile'); }

/* ---------- ثبت امروز ---------- */
function submitView() {
  const a = active(S.pw);
  $('#main').innerHTML = `<div id="sum"></div><div class="c"><div class="mu">فعالیت‌های امروز <b>${fd(S.today, {weekday: 'long', day: 'numeric', month: 'long'})}</b></div>
  ${a.map(c => `<label class="ch"><input type="checkbox" value="${c.id}" ${S.done.has(c.id) ? 'checked' : ''} onchange="tot()">${chIcon(c.category)}<span class="ct">${esc(c.title)}<small>${c.category}</small></span><b class="pt">+${fa(c.base_points)}</b></label>`).join('')}
  <p id="tot"></p><button class="p big" onclick="save()">${S.saved ? 'بروزرسانی فعالیت امروز' : 'ثبت فعالیت امروز'}</button>
  <p class="mu">هر کاری را که امروز انجام می‌دهید همین‌جا ثبت کنید. برای تغییر روزهای گذشته از تب تاریخچه استفاده کنید.</p></div>`;

}
function tot() {
  const a = active(S.pw), ck = [...document.querySelectorAll('.ch input:checked')].map(i => i.value);
  const done = a.filter(c => ck.includes(c.id)), base = sum(done), all = a.length && done.length === a.length;
  const bonus = all ? Math.round(sum(a) * .2) : 0;
  $('#tot').innerHTML = `<span class="chip">پایه ${fa(base)}</span><span class="chip">پاداش ${fa(bonus)}</span><b class="sum">مجموع ${fa(base + bonus)}</b>`;
}
async function summary() {
  const {data} = await sb.from('daily_scores').select('activity_date,daily_total,all_challenges_completed').eq('workspace_id', S.wid).eq('member_id', S.uid).gte('activity_date', addDays(S.today, -60));
  const d = {}; (data || []).forEach(r => d[r.activity_date] = {t: r.daily_total, ok: r.all_challenges_completed});
  const ws = weekStart(S.today); let score = 0;
  for (let i = 0; i < 7; i++) score += d[addDays(ws, i)]?.t || 0;
  const th = thr(S.pw), pct = th ? Math.min(100, Math.round(score / th * 100)) : 0;
  const el = $('#sum'); if (!el) return;
  el.innerHTML = `<div class="c stat"><div class="ring" style="--p:${pct}"><b>${fa(pct)}٪</b></div><div>
  <div class="mu">امتیاز این هفته</div><div class="big2">${fa(score)} <small>از حد نصاب ${fa(th)}</small></div>
  <div class="mu">🔥 روزهای کامل پیاپی: <b>${fa(streakOf(d))}</b></div></div></div>`;
}
async function save() {
  const ck = [...document.querySelectorAll('.ch input:checked')].map(i => i.value);
  const {error} = await sb.rpc('submit_today', {p_ws: S.wid, p_done: ck});
  if (error) return notify('ثبت انجام نشد: ' + error.message, false);
  const a = active(S.pw), all = a.length && a.every(c => ck.includes(c.id));

/* ---------- لیگ ---------- */
async function boardView() {
  const {data, error} = await sb.rpc('get_scores', {p_ws: S.wid, p_from: addDays(S.today, -60)});
  if (error) return $('#main').innerHTML = `<div class="msg err">${esc(error.message)}</div>`;
  const ws = weekStart(S.today), days = [...Array(7)].map((_, i) => addDays(ws, i)), by = {};
  (data || []).forEach(r => {
    (by[r.member_id] ??= {id: r.member_id, name: r.name, pw: r.progress_week, d: {}});
    if (r.activity_date) by[r.member_id].d[r.activity_date] = {t: r.daily_total, ok: r.all_completed};
  });
  const rows = Object.values(by).map(m => {
    const score = days.reduce((s, x) => s + (m.d[x]?.t || 0), 0);
    return {...m, score, streak: streakOf(m.d), ok: score >= thr(m.pw)};
  }).sort((a, b) => b.score - a.score);
  rows.forEach((r, i) => r.rank = i && r.score === rows[i - 1].score ? rows[i - 1].rank : i + 1);
  const wn = S.weeks.find(w => w.start_date === ws);
  $('#main').innerHTML = `<div class="c">
  <div class="row nob" style="padding:0"><div><h3 style="margin:0">جدول لیگ ${esc(S.ws.name)}</h3><div class="mu">چالش هفته ${wn ? fa(wn.week_number) : '—'}</div></div>
  <button class="icon" onclick="boardView()" title="به‌روزرسانی" aria-label="به‌روزرسانی">${svg('<path d="M21 12a9 9 0 1 1-2.6-6.3M21 4v5h-5"/>')}</button></div>
  <div class="w" style="margin-top:10px"><table><tr><th>رتبه</th><th>نام</th>${days.map(d => `<th>${fd(d, {weekday: 'short'})}</th>`).join('')}<th>جمع</th><th>🔥</th><th>وضعیت</th></tr>
  ${rows.map(r => `<tr class="${r.id === S.uid ? 'me' : ''}"><td>${['🥇', '🥈', '🥉'][r.rank - 1] || fa(r.rank)}</td>
  <td><span class="lnk" onclick="openProfile('${r.id}')">${esc(r.name)}</span></td>
  ${days.map(d => `<td>${r.d[d] ? fa(r.d[d].t) : ''}</td>`).join('')}<td><b>${fa(r.score)}</b></td><td>${fa(r.streak)}</td>
  <td>${r.ok ? 'حد نصاب تکمیل شد' : 'در حال پیشرفت'}</td></tr>`).join('')}</table></div></div>`;
}

  const sMap = {}; (sc.data || []).forEach(r => sMap[r.activity_date] = r);
  const pSet = new Set((pend.data || []).map(r => r.activity_date));
  const canEdit = S.mode === 'member';
  m.innerHTML = (S.edit && canEdit ? editCard() : '') + `<div class="c"><h3>روزهای گذشته</h3>
  <p class="mu">${canEdit ? 'برای ویرایش روی «ویرایش» بزنید. تغییرات پس از تایید ادمین لیگ اعمال می‌شوند.' : 'سوابق شما در این لیگ.'}</p>
  ${days.length ? days.map(d => {

    ${waiting ? '<span class="badge wait">در حال تایید</span>' : ''}</div>
    <div style="text-align:end"><div>${r ? `<b>${fa(r.daily_total)}</b> امتیاز${r.all_challenges_completed ? ' ✅' : ''}` : '<span class="mu">ثبت نشده</span>'}</div>
    ${canEdit ? `<button class="ghost2 small" onclick="startEdit('${d}')">ویرایش</button>` : ''}</div></div>`;
  }).join('') : '<p class="mu">هنوز روز گذشته‌ای در لیگ نیست.</p>'}</div>
  ${(wk.data || []).length ? `<div class="c"><h3>نتیجه چالش هفته‌ها</h3>${wk.data.map(r => `<div class="row"><span>چالش هفته ${fa(r.progress_week)}</span>

  <div class="full"><div class="mu" style="font-size:.85em">تاریخ تولد (شمسی)</div>${jdSel('p_b',1320,1400,1370,p.birth_date)}</div>
  <label>قد (cm)<input id="p_height" type="number" step="1" value="${esc(p.height_cm)}"></label>
  <label>وزن (kg)<input id="p_weight" type="number" step="0.1" value="${esc(p.weight_kg)}"></label>
  <label class="full">درباره من<textarea id="p_bio" rows="3" maxlength="500">${esc(p.bio)}</textarea></label>
  <label class="full">عکس جدید (اختیاری)<input id="p_img" type="file" accept="image/*"></label>
  <label class="full">رمز جدید ۵ رقمی (اختیاری)<input id="p_pin" type="password" inputmode="numeric" maxlength="5" dir="ltr"></label>
  </div><button class="p big" style="margin-top:12px" onclick="saveProfile()">ذخیره تغییرات</button>
  <p class="mu">شماره موبایل برای ورود است و قابل تغییر نیست.</p></div>
  <div class="c"><h3>عضویت این لیگ</h3><p class="mu">با ترک لیگ، سوابق شما باقی می‌ماند و بعداً با درخواست مجدد یا لینک دعوت دوباره می‌توانید برگردید.</p>
  <button onclick="leaveWs()">ترک این لیگ</button></div>`;
}
async function saveProfile() {
  const v = {first: $('#p_first').value.trim(), last: $('#p_last').value.trim(), gender: $('#p_gender').value,
    birth: jdRead('p_b'), height: normD($('#p_height').value), weight: normD($('#p_weight').value),
    bio: $('#p_bio').value.trim(), pin: normD($('#p_pin').value)};
  if (!v.first || !v.last) return notify('نام و نام خانوادگی لازم است', false);
  if (!v.birth) return notify('تاریخ تولد شمسی معتبر نیست', false);
  if (!(Number.isInteger(+v.height) && +v.height >= 50 && +v.height <= 260)) return notify('قد معتبر نیست', false);
  if (!(+v.weight >= 20 && +v.weight <= 400)) return notify('وزن معتبر نیست', false);
  if (!v.bio) return notify('بخش درباره من خالی است', false);
  if (v.pin && !/^\d{5}$/.test(v.pin)) return notify('رمز باید ۵ رقمی باشد', false);
  let avatar = null; const f = $('#p_img').files[0];
  if (f) avatar = await resizeImg(f, 256);
  const {error} = await sb.rpc('update_profile', {p_first: v.first, p_last: v.last, p_gender: v.gender, p_birth: v.birth,
    p_height: Math.round(+v.height), p_weight: +v.weight, p_bio: v.bio, p_avatar: avatar});
  if (error) return notify('ذخیره نشد: ' + error.message, false);
  if (v.pin) {
    const {error: e2} = await sb.auth.updateUser({password: PW(v.pin)});
    if (e2) return notify('اطلاعات ذخیره شد ولی رمز عوض نشد: ' + e2.message, false);
  }
  S.me = (await sb.from('profiles').select('*').eq('id', S.uid).single()).data || S.me;
  notify('ذخیره شد ✅'); reload();
}
async function leaveWs() {
  if (!confirm('از این لیگ خارج می‌شوید؟ سوابق شما باقی می‌ماند.')) return;
  const {error} = await sb.rpc('leave_workspace', {p_ws: S.wid});
  if (error) return notify(error.message, false);
  notify('از لیگ خارج شدید.'); boot();
}

/* ---------- مدیریت لیگ (ادمین لیگ و سوپر ادمین) ---------- */
async function adminView() {
  const wid = S.wid;
  const [pm, mem, de] = await Promise.all([
    sb.from('memberships').select('user_id,role,status,progress_week').eq('workspace_id', wid).eq('status', 'pending'),
    sb.from('memberships').select('user_id,role,status,progress_week').eq('workspace_id', wid).eq('status', 'active'),
    sb.from('day_edit_requests').select('*').eq('workspace_id', wid).eq('status', 'pending').order('created_at')]);
  const pendM = pm.data || [], actM = mem.data || [], pendD = de.data || [];
  const ids = [...new Set([...pendM.map(x => x.user_id), ...actM.map(x => x.user_id), ...pendD.map(x => x.member_id)])];
  const pr = ids.length ? await sb.from('profiles').select('id,display_name,first_name,last_name,phone,gender,birth_date,height_cm,weight_kg,bio,avatar').in('id', ids) : {data: []};
  const P = {}; (pr.data || []).forEach(p => P[p.id] = p);
  const closable = S.weeks.filter(w => w.status !== 'closed' && w.end_date < S.today);
  $('#main').innerHTML = `
  ${section(`درخواست عضویت (${fa(pendM.length)})`, pendM.map(x => { const p = P[x.user_id] || {}; return `<div class="c" style="margin:8px 0">
    <div class="row nob" style="padding:0;justify-content:flex-start">${av(p, 48)}<div><b>${esc(nmOf(p))}</b><div class="mu" dir="ltr">${esc(p.phone || '')}</div></div></div>
    <div class="mu">${esc(p.gender || '')} · ${p.birth_date ? fd(p.birth_date, {year: 'numeric', month: 'long', day: 'numeric'}) : ''} · قد ${esc(p.height_cm)} · وزن ${esc(p.weight_kg)}</div>
    <p>${esc(p.bio || '')}</p>
    <div style="display:flex;gap:8px"><button class="p small" onclick="decideMember('${x.user_id}',true)">تایید</button><button class="small" onclick="decideMember('${x.user_id}',false)">رد</button></div></div>`; }))}
  ${section(`اعضای فعال (${fa(actM.length)})`, actM.map(x => { const p = P[x.user_id] || {}; return `<div class="row">
    <div><b>${esc(nmOf(p))}</b> ${x.role === 'admin' ? '<span class="tag">ادمین</span>' : ''}<div class="mu">چالش هفته ${fa(x.progress_week)}</div></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="small" onclick="setRole('${x.user_id}','${x.role === 'admin' ? 'member' : 'admin'}')">${x.role === 'admin' ? 'عضو کردن' : 'ادمین کردن'}</button>
    <button class="small" onclick="removeMem('${x.user_id}')">اخراج</button></div></div>`; }))}
  <div class="c"><h3>دعوت خصوصی</h3><p class="mu">لینک را برای کسی بفرستید؛ با باز کردن آن، فوراً عضو لیگ می‌شود.</p>
  <div class="f"><label>مدت اعتبار (روز، خالی = بدون انقضا)<input id="iv_d" type="number" min="1"></label>
  <label>تعداد دفعات مجاز (خالی = نامحدود)<input id="iv_m" type="number" min="1"></label></div>
  <button class="p big" style="margin-top:10px" onclick="makeInvite()">ساخت لینک دعوت</button>
  <input id="iv_out" readonly dir="ltr" style="margin-top:8px;display:none"></div>
  ${section(`درخواست ویرایش روزها (${fa(pendD.length)})`, pendD.map(r => `<div class="row" style="align-items:flex-start">
    <div><b>${esc(nmOf(P[r.member_id]))}</b><div class="mu">${fd(r.activity_date, {weekday: 'long', day: 'numeric', month: 'long'})}</div>
    <div class="mu">پیشنهاد: ${(r.proposed_done || []).map(id => S.ch.find(c => c.id === id)?.title).filter(Boolean).map(esc).join('، ') || 'هیچ‌کدام'}</div></div>
    <div style="display:flex;gap:6px"><button class="p small" onclick="decideEdit(${r.id},true)">تایید</button><button class="small" onclick="decideEdit(${r.id},false)">رد</button></div></div>`))}
  <div class="c"><h3>تنظیمات لیگ</h3>
  <label style="font-size:.85em;color:var(--mu)">نام لیگ<input id="ws_name" value="${esc(S.ws.name)}"></label>
  <label style="font-size:.85em;color:var(--mu);margin-top:6px">نوع لیگ<select id="ws_vis"><option value="public" ${S.ws.visibility === 'public' ? 'selected' : ''}>عمومی</option><option value="private" ${S.ws.visibility === 'private' ? 'selected' : ''}>خصوصی</option></select></label>
  <button class="p big" style="margin-top:8px" onclick="saveWs()">ذخیره تنظیمات</button>
  <div class="row" style="margin-top:8px"><div>${logo(56)}</div><input type="file" accept="image/*" onchange="setLogo(this)" style="width:auto"></div></div>
  <div class="c"><h3>چالش‌ها</h3><p class="mu">«چالش هفته شروع» یعنی این چالش برای اعضایی فعال می‌شود که به همان چالش هفته برسند. تغییر امتیاز یا غیرفعال‌کردن وسط هفته حد نصاب را عوض می‌کند.</p></div>
  ${S.ch.map(chRow).join('')}
  <div class="c"><h3>چالش جدید</h3>
  <input id="ct_new" placeholder="عنوان چالش" style="margin-bottom:6px">
  <div class="f"><label>دسته<select id="ck_new">${CATS.map(k => `<option>${k}</option>`).join('')}</select></label>
  <label>امتیاز<input id="cp_new" type="number" min="1"></label>
  <label class="full">چالش هفته شروع<input id="cs_new" type="number" min="1"></label></div>
  <button class="p big" style="margin-top:10px" onclick="addCh()">افزودن</button></div>
  <div class="c"><h3>بستن چالش هفته و ارتقا</h3>
  ${closable.length ? `<select id="cw" style="margin-bottom:8px">${closable.map(w => `<option value="${w.id}">چالش هفته ${fa(w.week_number)} (${fd(w.start_date, {day: 'numeric', month: 'long'})})</option>`).join('')}</select>
  <button class="p" onclick="closeWeek()">بستن هفته</button>` : '<p class="mu">هفته‌ای که تمام شده و بسته نشده باشد وجود ندارد.</p>'}</div>`;
}
async function decideMember(uid, ok) {
  const {error} = await sb.rpc('approve_membership', {p_ws: S.wid, p_user: uid, p_ok: ok});
  notify(error ? error.message : ok ? 'عضو تایید شد ✅' : 'درخواست رد شد', !error); adminOnly();
}
async function setRole(uid, role) {
  const {error} = await sb.rpc('set_member_role', {p_ws: S.wid, p_user: uid, p_role: role});
  notify(error ? error.message : 'نقش تغییر کرد ✅', !error); adminOnly();
}
async function removeMem(uid) {
  if (!confirm('این عضو از لیگ اخراج شود؟ سوابقش باقی می‌ماند.')) return;
  const {error} = await sb.rpc('remove_member', {p_ws: S.wid, p_user: uid});
  notify(error ? error.message : 'عضو اخراج شد', !error); adminOnly();
}
async function makeInvite() {
  const d = normD($('#iv_d').value), m = normD($('#iv_m').value);
  const {data, error} = await sb.rpc('create_invite', {p_ws: S.wid, p_days: d ? +d : null, p_max: m ? +m : null});
  if (error) return notify(error.message, false);
  const link = `${location.origin}${location.pathname}?join=${data}`;
  const o = $('#iv_out'); o.style.display = 'block'; o.value = link; o.select();
  notify('لینک دعوت ساخته شد ✅');
}
async function decideEdit(id, ok) {
  const {error} = await sb.rpc('approve_day_edit', {p_id: id, p_ok: ok});
  notify(error ? error.message : ok ? 'ویرایش اعمال شد ✅' : 'درخواست رد شد', !error); adminOnly();
}
async function saveWs() {
  const name = $('#ws_name').value.trim(), vis = $('#ws_vis').value;
  if (!name) return notify('نام لیگ را وارد کنید', false);
  const {error} = await sb.from('workspaces').update({name, visibility: vis}).eq('id', S.wid);
  notify(error ? error.message : 'ذخیره شد ✅', !error); reload();
}
async function setLogo(inp) {
  const f = inp.files[0]; if (!f) return;
  try {
    const data = await resizeImg(f, 256, 'image/png');
    const {error} = await sb.from('workspaces').update({logo: data}).eq('id', S.wid);
    if (error) throw error;
    notify('لوگوی لیگ تغییر کرد ✅'); reload();
  } catch (e) { notify('لوگو ذخیره نشد: ' + (e.message || e), false); }
}
function chRow(c) {
  return `<div class="c"><div class="row nob" style="padding:0;justify-content:flex-start">${chIcon(c.category)}<input id="ct_${c.id}" value="${esc(c.title)}"></div>
  <div class="f" style="margin-top:6px"><label>دسته<select id="ck_${c.id}">${CATS.map(k => `<option ${k === c.category ? 'selected' : ''}>${k}</option>`).join('')}</select></label>
  <label>امتیاز<input id="cp_${c.id}" type="number" min="1" value="${esc(c.base_points)}"></label>
  <label class="full">چالش هفته شروع<input id="cs_${c.id}" type="number" min="1" value="${esc(c.start_week)}"></label></div>
  <div class="row nob"><label><input type="checkbox" id="ca_${c.id}" style="width:auto" ${c.is_active ? 'checked' : ''}> فعال</label>
  <button class="p small" onclick="saveCh('${c.id}')">ذخیره</button></div></div>`;
}
function chRead(id) {
  const pts = Math.round(+$('#cp_' + id).value), sw = Math.round(+$('#cs_' + id).value), t = $('#ct_' + id).value.trim();
  if (!t || pts < 1 || sw < 1) return null;
  return {title: t, category: $('#ck_' + id).value, base_points: pts, start_week: sw};
}
async function saveCh(id) {
  const v = chRead(id); if (!v) return notify('عنوان، امتیاز و چالش هفته شروع را درست وارد کنید', false);
  const {error} = await sb.from('challenges').update({...v, is_active: $('#ca_' + id).checked, updated_at: new Date().toISOString()}).eq('workspace_id', S.wid).eq('id', id);
  notify(error ? error.message : 'ذخیره شد ✅', !error); reload();
}
async function addCh() {
  const v = chRead('new'); if (!v) return notify('عنوان، امتیاز و چالش هفته شروع را درست وارد کنید', false);
  const n = Math.max(0, ...S.ch.map(c => parseInt(c.id.slice(1)) || 0)) + 1;
  const {error} = await sb.from('challenges').insert({workspace_id: S.wid, id: 'C' + String(n).padStart(3, '0'), ...v});
  notify(error ? error.message : 'چالش اضافه شد ✅', !error); reload();
}
async function closeWeek() {
  const {error} = await sb.rpc('close_week', {p_ws: S.wid, p_week: +$('#cw').value});
  notify(error ? error.message : 'چالش هفته بسته شد و ارتقاها اعمال شد.', !error); reload();
}
function adminOnly() { if (S.tab !== 'admin') go('admin'); else adminView(); }

boot();
</script></body></html>
