<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {})); }
const SUPABASE_URL = "https://ekmiynpjugfqdnwfofgn.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVrbWl5bnBqdWdmcWRud2ZvZmduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzNjU1MTcsImV4cCI6MjEwNzk0MTUxN30.6i1LKuj9KUbJAJ916Yo7AOC-_VtftDpVhdDEeR8f5LA";

const fa = n => Number(n).toLocaleString('fa-IR');
const DAY = 864e5, ms = s => Date.parse(s + 'T00:00:00Z'), str = m => new Date(m).toISOString().slice(0, 10);
const addDays = (s, n) => str(ms(s) + n * DAY);
const fd = (s, o) => new Date(ms(s)).toLocaleDateString('fa-IR-u-ca-persian', {timeZone: 'UTC', ...o});
const todayIn = tz => new Intl.DateTimeFormat('en-CA', {timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit'}).format(new Date());
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

const jParts = new Intl.DateTimeFormat('en-u-ca-persian', {timeZone: 'UTC', year: 'numeric', month: 'numeric', day: 'numeric'});
function toJal(g) { const p = jParts.formatToParts(new Date(ms(g))); const v = t => +p.find(x => x.type === t).value; return {y: v('year'), m: v('month'), d: v('day')}; }
function toGreg(y, m, d) {
  if (!y || !m || !d) return null;
  const start = ms(`${y + 621}-01-01`);
  for (let i = 0; i < 520; i++) {
    const g = str(start + i * DAY), j = toJal(g);
    if (j.y === y && j.m === m && j.d === d) return g;
    if (j.y > y || (j.y === y && (j.m > m || (j.m === m && j.d > d)))) return null;
  }
  return null;
}
function jdSel(p, minY, maxY, defY, greg) {
  const j = greg ? toJal(greg) : {y: defY, m: 1, d: 1};
  let ys = ''; for (let y = minY; y <= maxY; y++) ys += `<option value="${y}" ${y === j.y ? 'selected' : ''}>${fa(y)}</option>`;
  let mo = ''; JM.forEach((n, i) => mo += `<option value="${i + 1}" ${i + 1 === j.m ? 'selected' : ''}>${fa(i + 1)} - ${n}</option>`);
  let dy = ''; for (let d = 1; d <= 31; d++) dy += `<option value="${d}" ${d === j.d ? 'selected' : ''}>${fa(d)}</option>`;
  return `<div class="jd"><select id="${p}_y">${ys}</select><select id="${p}_m">${mo}</select><select id="${p}_d">${dy}</select></div>`;
}
const jdRead = p => toGreg(+$('#' + p + '_y').value, +$('#' + p + '_m').value, +$('#' + p + '_d').value);

const DEF_LOGO = '<svg viewBox="0 0 64 64"><rect width="64" height="64" rx="18" fill="#2f9e6b"/><path d="M12 20 22 46 32 26 42 46 52 20" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const S = {tab: 'submit', edit: null, viewId: null, ws: null, wid: null, M: null, mode: 'guest', isMember: false, isAdmin: false,
  isSuper: false, ch: [], cats: [], fields: [], weeks: [], done: new Set(), saved: false, today: null, platformLogo: null, mships: []};
let legacy = false;

const logo = (n = 40, src) => { const s = src !== undefined ? src : (S.ws?.logo || S.platformLogo); return s ? `<img src="${s}" alt="" style="width:${n}px;height:${n}px;object-fit:contain">` : DEF_LOGO.replace('<svg ', `<svg width="${n}" height="${n}" `); };
const av = (p, n = 56) => p.avatar ? `<img class="av" src="${p.avatar}" alt="" style="width:${n}px;height:${n}px">` : `<div class="av" style="width:${n}px;height:${n}px">${esc(((p.name || '؟')[0]))}</div>`;
const nmOf = p => p ? (((p.name || '') + ' ' + (p.last_name || '')).trim() || '—') : '—';
function notify(t, ok = true) {
  document.querySelectorAll('.busy').forEach(b => b.classList.remove('busy'));
  const d = document.createElement('div'); d.className = 'toast msg ' + (ok ? 'ok' : 'err'); d.textContent = t;
  document.body.appendChild(d); setTimeout(() => d.remove(), 4500);
}
document.addEventListener('click', e => {
  const b = e.target.closest('button.p, button[data-b]');
  if (!b) return;
  if (b.classList.contains('busy')) { e.stopPropagation(); e.preventDefault(); return; }
  b.classList.add('busy'); setTimeout(() => b.classList.remove('busy'), 12000);
}, true);
function resizeImg(file, max = 256, type = 'image/jpeg') {
  return new Promise((res, rej) => {
    const r = new FileReader(); r.onerror = rej;
    r.onload = () => {
      const im = new Image(); im.onerror = rej;
      im.onload = () => {
        const k = Math.min(1, max / Math.max(im.width, im.height));
        const c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL(type, .85));
      };
      im.src = r.result;
    };
    r.readAsDataURL(file);
  });
}
const svg = (p, c = 'currentColor', n = 22) => `<svg width="${n}" height="${n}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const DEF_ICON = '<path d="M4 12h16M12 4v16"/>';
const chIcon = cat => {
  const c = cat?.color || '#8a9a90';
  return `<span class="ib" style="background:${c}22">${cat?.icon ? `<img src="${cat.icon}" alt="">` : svg(DEF_ICON, c)}</span>`;
};
const TABI = {
  submit: '<path d="M5 12l5 5L20 7"/>',
  board: '<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>',
  hist: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  profile: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>',
  admin: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'};
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); window.__installEv = e; });
function installBtn() { return window.__installEv ? '<button class="ghost2 small" onclick="installApp()">📲 نصب برنامه</button>' : ''; }
async function installApp() { const e = window.__installEv; if (!e) return; e.prompt(); await e.userChoice; window.__installEv = null; render(); }
// اگر خطایی رخ داد، متنش روی صفحه نشان داده شود (به‌جای بارگذاری بی‌پایان)
window.addEventListener('error', e => showFatal(e.message));
window.addEventListener('unhandledrejection', e => showFatal(e.reason?.message || String(e.reason)));
function showFatal(msg) { const a = document.getElementById('app'); if (a) a.innerHTML = `<div class="c msg err">خطا: ${esc(msg)}</div><button class="p big" onclick="location.reload()">تلاش دوباره</button>`; }
// اگر تا ۱۰ ثانیه چیزی نشان داده نشد، وضعیت را گزارش کن
setTimeout(() => { const a = document.getElementById('app'); if (a && (a.textContent.trim() === '' || a.textContent.includes('در حال بارگذاری'))) showFatal('برنامه بعد از ۱۰ ثانیه بالا نیامد. اتصال را بررسی کنید.'); }, 10000);
const section = (title, items) => `<div class="c"><h3>${title}</h3>${items.length ? items.join('') : '<p class="mu">موردی نیست.</p>'}</div>`;
const card = (title, sub, action) => `<div class="row"><div><b>${esc(title)}</b><div>${sub}</div></div><div>${action}</div></div>`;

/* ---------- تنظیم‌های لیگ و مراحل ---------- */
const PROVINCES = ['آذربایجان شرقی','آذربایجان غربی','اردبیل','اصفهان','البرز','ایلام','بوشهر','تهران','چهارمحال و بختیاری','خراسان جنوبی','خراسان رضوی','خراسان شمالی','خوزستان','زنجان','سمنان','سیستان و بلوچستان','فارس','قزوین','قم','کردستان','کرمان','کرمانشاه','کهگیلویه و بویراحمد','گلستان','گیلان','لرستان','مازندران','مرکزی','هرمزگان','همدان','یزد'];
const FIELDS = {
  name: {l: 'نام', t: 'text'}, last_name: {l: 'نام خانوادگی', t: 'text'}, nickname: {l: 'نام مستعار', t: 'text'},
  birth_date: {l: 'تاریخ تولد (شمسی)', t: 'jdate'}, gender: {l: 'جنسیت', t: 'select', o: ['مرد', 'زن']},
  height: {l: 'قد (cm)', t: 'num'}, weight: {l: 'وزن (kg)', t: 'dec'}, email: {l: 'ایمیل', t: 'email'},
  province: {l: 'استان', t: 'select', o: PROVINCES}, city: {l: 'شهر', t: 'text'}, location: {l: 'لوکیشن', t: 'text'},
  job: {l: 'شغل', t: 'text'}, marital_status: {l: 'وضعیت تاهل', t: 'select', o: ['مجرد', 'متاهل']},
  avatar: {l: 'عکس پروفایل', t: 'file'}, bio: {l: 'درباره من', t: 'area'}};
const FIELD_KEYS = Object.keys(FIELDS);

function formHtml(keys, reqMap, cur = {}) {
  return keys.map(k => {
    const m = FIELDS[k], req = reqMap[k] ? ' <span style="color:#a12a2a">*</span>' : '';
    let inp = '';
    if (m.t === 'jdate') inp = jdSel('f_' + k, 1320, 1400, 1370, cur[k]);
    else if (m.t === 'select') inp = `<select id="f_${k}"><option value="">انتخاب کنید</option>${m.o.map(o => `<option ${cur[k] === o ? 'selected' : ''}>${o}</option>`).join('')}</select>`;
    else if (m.t === 'area') inp = `<textarea id="f_${k}" rows="3" maxlength="500">${esc(cur[k])}</textarea>`;
    else if (m.t === 'file') inp = `<input id="f_${k}" type="file" accept="image/*">`;
    else if (m.t === 'num') inp = `<input id="f_${k}" type="number" inputmode="numeric" step="1" value="${esc(cur[k])}">`;
    else if (m.t === 'dec') inp = `<input id="f_${k}" type="number" inputmode="decimal" step="0.1" value="${esc(cur[k])}">`;
    else if (m.t === 'email') inp = `<input id="f_${k}" type="email" dir="ltr" value="${esc(cur[k])}">`;
    else inp = `<input id="f_${k}" value="${esc(cur[k])}">`;
    const wide = ['jdate', 'area', 'file'].includes(m.t) ? 'full' : '';
    return `<div class="${wide}"><div class="mu" style="font-size:.85em">${m.l}${req}</div>${inp}</div>`;
  }).join('');
}
// خواندن فرم؛ اگر مقدار قبلی وجود داشته باشد، خالی بودن الزامی نیست
async function readForm(keys, reqMap, cur = {}) {
  const out = {}, miss = [], errs = [];
  for (const k of keys) {
    const m = FIELDS[k]; let v = null;
    if (m.t === 'jdate') v = jdRead('f_' + k);
    else if (m.t === 'file') { const f = $('#f_' + k).files[0]; if (f) v = await resizeImg(f, 256); }
    else if (m.t === 'num' || m.t === 'dec') v = normD($('#f_' + k).value) || null;
    else v = ($('#f_' + k).value || '').trim() || null;
    if (v === null && cur[k] === undefined && reqMap[k]) miss.push(m.l);
    if (v !== null) out[k] = v;
    if (k === 'height' && v && !(Number.isInteger(+v) && +v >= 50 && +v <= 260)) errs.push('قد باید عدد صحیح بین ۵۰ و ۲۶۰ باشد');
    if (k === 'weight' && v && !(+v >= 20 && +v <= 400)) errs.push('وزن باید بین ۲۰ و ۴۰۰ باشد');
    if (k === 'email' && v && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) errs.push('ایمیل معتبر نیست');
    if (k === 'birth_date' && v === null && reqMap[k]) miss.push(m.l);
  }
  if (miss.length) errs.unshift('این فیلدها الزامی است: ' + [...new Set(miss)].join('، '));
  return {data: out, errs};
}

/* ---------- ورود و ثبت‌نام (جهانی) ---------- */
function captureJoin() {
  const t = new URLSearchParams(location.search).get('join');
  if (t) { localStorage.setItem('wcd_join', t); history.replaceState(null, '', location.pathname); }
}
async function boot() {
  captureJoin();
  const {data: {session}} = await sb.auth.getSession();
  if (!session) {
    const g = await sb.from('game_settings').select('logo').single();
    if (!g.error) S.platformLogo = g.data.logo;
    return authView('login');
  }
  S.uid = session.user.id;
  const [g, p, mm] = await Promise.all([
    sb.from('game_settings').select('logo').single(),
    sb.from('profiles').select('*').eq('id', S.uid).single(),
    sb.from('memberships').select('*').eq('user_id', S.uid)]);
  if (!g.error) S.platformLogo = g.data.logo;
  if (p.error || !p.data || p.data.status !== 'active') { await sb.auth.signOut(); return authView('login'); }
  S.me = p.data; S.isSuper = !!p.data.is_super;
  if (localStorage.getItem('wcd_join')) return inviteJoinView(localStorage.getItem('wcd_join'));

/* ---------- قاب لیگ ---------- */
async function openWs(id, tab) {
  const today0 = todayIn('Asia/Tehran');
  const [wr, mm, ch, cats, wk, fl, sub] = await Promise.all([
    sb.from('workspaces').select('*').eq('id', id).single(),
    sb.from('memberships').select('*').eq('workspace_id', id).eq('user_id', S.uid).maybeSingle(),
    sb.from('challenges').select('*').eq('workspace_id', id).order('level').order('id'),
    sb.from('categories').select('*').eq('workspace_id', id).order('name'),
    sb.from('calendar_weeks').select('*').eq('workspace_id', id).order('week_number'),
    sb.from('workspace_profile_fields').select('*').eq('workspace_id', id),
    sb.from('submissions').select('challenge_id,completed,activity_date').eq('workspace_id', id).eq('member_id', S.uid).gte('activity_date', addDays(today0, -1))]);
  const w = wr.data;
  if (wr.error || !w) return notify('این لیگ در دسترس نیست', false);
  if (ch.error || wk.error) return notify('خطا در دریافت اطلاعات لیگ', false);
  const M = mm.data || null;
  S.ws = w; S.wid = id; S.M = M; S.edit = null;
  S.isMember = !!M && M.status === 'active';
  S.mode = S.isMember ? 'member' : (M ? 'archive' : 'guest');
  S.isAdmin = S.isSuper || (S.isMember && M.role === 'admin');
  S.today = todayIn(w.tz);
  S.ch = (ch.data || []).filter(c => !c.deleted_at);
  S.cats = cats.data || []; S.weeks = wk.data || []; S.fields = fl.data || [];
  const subToday = (sub.data || []).filter(r => r.activity_date === S.today);
  S.done = new Set(subToday.filter(r => r.completed).map(r => r.challenge_id));
  S.saved = subToday.length > 0;
  applyPalette(w.palette);
  S.tab = tab || (S.mode === 'archive' ? 'hist' : S.isMember ? 'submit' : 'board');
  render();
}
function reload() { return openWs(S.wid, S.tab); }
function applyPalette(p) {
  const r = document.documentElement.style;
  r.setProperty('--ac', p?.primary || '#2f9e6b'); r.setProperty('--ac2', p?.dark || '#1f7a52');

// دوره جاری (مرحله‌ی ۷ روزه‌ای که امروز در آن است؛ اگر نیست، نزدیک‌ترین)
function curPeriod() {
  const open = S.weeks.filter(w => w.status !== 'closed');
  return S.weeks.find(w => w.start_date <= S.today && S.today <= w.end_date)
      || open.find(w => w.start_date > S.today) || S.weeks[S.weeks.length - 1] || null;
}

const lvlBonus = L => S.ws.bonus_enabled ? Math.floor(lvlSum(L) * S.ws.bonus_percent / 100) : 0;
const lvlWin = L => Math.round((lvlSum(L) + lvlBonus(L)) * 7 * S.ws.win_percent / 100);
const topLevel = () => S.ch.reduce((m, c) => Math.max(m, c.level), 0);

/* ---------- ثبت امروز ---------- */
function submitView() {
  const L = S.M.level, a = lvlChallenges(L), P = curPeriod();
  const inPeriod = P && P.start_date <= S.today && S.today <= P.end_date;
  const notStarted = S.M.active_from && S.M.active_from > S.today;
  const catOf = c => S.cats.find(k => k.id === c.category_id);
  $('#main').innerHTML = `<div id="sum"></div>
  ${notStarted ? `<div class="c"><b>ثبت شما از ${fd(S.M.active_from, {day: 'numeric', month: 'long'})} شروع می‌شود.</b></div>` : ''}
  ${!inPeriod && !notStarted ? '<div class="c mu">امروز در هیچ مرحله‌ای از این لیگ نیست.</div>' : ''}
  <div class="c"><div class="mu">چالش‌های امروز (سطح ${fa(L)}) — <b>${fd(S.today, {weekday: 'long', day: 'numeric', month: 'long'})}</b></div>
  ${a.map(c => `<label class="ch"><input type="checkbox" value="${c.id}" ${S.done.has(c.id) ? 'checked' : ''} onchange="tot()">${chIcon(catOf(c))}
    <span class="ct">${esc(c.title)}<small>${catOf(c) ? esc(catOf(c).name) : ''}${c.link ? ` · <a href="${esc(c.link)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">توضیح بیشتر</a>` : ''}</small></span>
    <b class="pt">+${fa(c.base_points)}</b></label>`).join('')}
  <p id="tot"></p>
  ${inPeriod && !notStarted ? `<button class="p big" onclick="save()">${S.saved ? 'بروزرسانی فعالیت امروز' : 'ثبت فعالیت امروز'}</button>` : ''}
  <p class="mu">ثبت فقط برای امروز است. برای روزهای گذشته از تب تاریخچه استفاده کنید.</p></div>`;
  tot(); summary();
}
function tot() {
  const L = S.M.level, a = lvlChallenges(L), ck = [...document.querySelectorAll('.ch input:checked')].map(i => i.value);
  const done = a.filter(c => ck.includes(c.id)), base = done.reduce((s, c) => s + c.base_points, 0);
  const all = a.length && done.length === a.length, bonus = all && S.ws.bonus_enabled ? lvlBonus(L) : 0;
  $('#tot').innerHTML = `<span class="chip">پایه ${fa(base)}</span><span class="chip">پاداش ${fa(bonus)}</span><b class="sum">مجموع ${fa(base + bonus)}</b>`;
}
async function summary() {
  const P = curPeriod(); if (!P) return;
  const {data} = await sb.from('daily_scores').select('activity_date,daily_total').eq('workspace_id', S.wid).eq('member_id', S.uid)
    .gte('activity_date', P.start_date).lte('activity_date', P.end_date);
  const score = (data || []).reduce((s, r) => s + r.daily_total, 0), th = lvlWin(S.M.level);
  const pct = th ? Math.min(100, Math.round(score / th * 100)) : 0;
  const el = $('#sum'); if (!el) return;
  el.innerHTML = `<div class="c stat"><div class="ring" style="--p:${pct}"><b>${fa(pct)}٪</b></div><div>
  <div class="mu">امتیاز این مرحله</div><div class="big2">${fa(score)} <small>از امتیاز پیروزی ${fa(th)}</small></div>
  <div class="mu">🔥 تداوم فعلی: <b>${fa(S.M.current_streak)}</b> روز</div></div></div>`;
}
async function save() {
  const ck = [...document.querySelectorAll('.ch input:checked')].map(i => i.value);
  const {error} = await sb.rpc('submit_today', {p_ws: S.wid, p_done: ck});
  if (error) return notify('ثبت انجام نشد: ' + error.message, false);
  const a = lvlChallenges(S.M.level), all = a.length && a.every(c => ck.includes(c.id));
  notify(all ? 'عالی! امروز همه چالش‌ها کامل شد 🎉' : 'ثبت شد ✅');
  reload();
}

/* ---------- لیدربورد: ستون‌های روزهای دوره‌ی جاری ---------- */
async function boardView() {
  const P = curPeriod();
  const {data, error} = await sb.rpc('get_scores', {p_ws: S.wid, p_from: P ? P.start_date : S.today});
  if (error) return $('#main').innerHTML = `<div class="msg err">${esc(error.message)}</div>`;
  const days = P ? [...Array(7)].map((_, i) => addDays(P.start_date, i)) : [];
  const by = {};
  (data || []).forEach(r => {
    (by[r.member_id] ??= {id: r.member_id, name: r.name, level: r.level, d: {}});
    if (r.activity_date) by[r.member_id].d[r.activity_date] = r.daily_total;
  });
  const rows = Object.values(by).map(m => {
    const total = days.reduce((s, x) => s + (m.d[x] || 0), 0);
    return {...m, total};
  }).sort((a, b) => b.total - a.total);
  rows.forEach((r, i) => r.rank = i && r.total === rows[i - 1].total ? rows[i - 1].rank : i + 1);
  const heading = P ? `${fd(P.start_date, {day: 'numeric', month: 'long'})} تا ${fd(P.end_date, {day: 'numeric', month: 'long'})}` : '—';
  $('#main').innerHTML = `<div class="c">
  <div class="row nob" style="padding:0"><div><h3 style="margin:0">جدول لیگ ${esc(S.ws.name)}</h3><div class="mu">${heading}</div></div>
  <button class="icon" onclick="boardView()" title="به‌روزرسانی" aria-label="به‌روزرسانی">${svg('<path d="M21 12a9 9 0 1 1-2.6-6.3M21 4v5h-5"/>')}</button></div>
  <div class="w" id="tw" style="margin-top:10px"><table><tr><th>رتبه</th><th>نام</th><th>سطح</th>
  ${days.map(d => `<th class="${d === S.today ? 'today' : ''}" ${d === S.today ? 'id="todayTh"' : ''}>${fd(d, {weekday: 'long'})}</th>`).join('')}
  <th>جمع مرحله</th></tr>
  ${rows.map(r => `<tr class="${r.id === S.uid ? 'me' : ''}"><td>${['🥇', '🥈', '🥉'][r.rank - 1] || fa(r.rank)}</td>
  <td><span class="lnk" onclick="openProfile('${r.id}')">${esc(r.name)}</span></td><td>${fa(r.level)}</td>
  ${days.map(d => `<td class="${d === S.today ? 'today' : ''}">${r.d[d] !== undefined ? fa(r.d[d]) : ''}</td>`).join('')}
  <td><b>${fa(r.total)}</b></td></tr>`).join('')}</table></div></div>`;
  const t = $('#todayTh'), w = $('#tw'); if (t && w) w.scrollLeft = t.offsetLeft - w.clientWidth / 2;
}

/* ---------- تاریخچه و ویرایش روزهای گذشته ---------- */
async function histView() {
  const m = $('#main'), P = curPeriod();
  const from = S.M.active_from || S.today;
  const days = [];
  for (let d = addDays(S.today, -1); d >= from && days.length < 60; d = addDays(d, -1)) days.push(d);
  const [sc, pend] = await Promise.all([
    sb.from('daily_scores').select('activity_date,daily_total,all_challenges_completed').eq('workspace_id', S.wid).eq('member_id', S.uid).gte('activity_date', from),
    sb.from('day_edit_requests').select('activity_date').eq('workspace_id', S.wid).eq('member_id', S.uid).eq('status', 'pending')]);
  const sMap = {}; (sc.data || []).forEach(r => sMap[r.activity_date] = r);
  const pSet = new Set((pend.data || []).map(r => r.activity_date));
  const canEdit = S.mode === 'member';
  const editable = d => canEdit && P && d >= P.start_date && d <= P.end_date && d < S.today && P.status !== 'closed';
  m.innerHTML = (S.edit && canEdit ? editCard() : '') + `<div class="c"><h3>روزهای عضویت شما</h3>
  <p class="mu">عضو از ${fd(from, {day: 'numeric', month: 'long', year: 'numeric'})} · ${fa(Math.max(1, Math.round((ms(S.today) - ms(from)) / DAY) + 1))} روز</p>
  <p class="mu">ویرایش فقط برای روزهای مرحله جاری است و پس از تایید ادمین اعمال می‌شود.</p>
  ${days.length ? days.map(d => {
    const r = sMap[d], waiting = pSet.has(d);
    return `<div class="row ${waiting ? 'dwait' : ''}"><div><div>${fd(d, {weekday: 'long', day: 'numeric', month: 'long'})}</div>
    ${waiting ? '<span class="badge wait">در حال تایید</span>' : ''}</div>
    <div style="text-align:end"><div>${r ? `<b>${fa(r.daily_total)}</b> امتیاز${r.all_challenges_completed ? ' ✅' : ''}` : '<span class="mu">ثبت نشده</span>'}</div>
    ${editable(d) ? `<button class="ghost2 small" onclick="startEdit('${d}')">ویرایش</button>` : ''}</div></div>`;
  }).join('') : '<p class="mu">هنوز روزی ثبت نشده است.</p>'}</div>`;
}
async function startEdit(d) {
  const {data} = await sb.from('submissions').select('challenge_id,completed').eq('workspace_id', S.wid).eq('member_id', S.uid).eq('activity_date', d);
  S.edit = {date: d, done: new Set((data || []).filter(r => r.completed).map(r => r.challenge_id))};
  histView(); window.scrollTo(0, 0);
}
function editCard() {
  const e = S.edit, a = lvlChallenges(S.M.level);
  return `<div class="c" style="border-color:var(--ac)"><h3>ویرایش ${fd(e.date, {weekday: 'long', day: 'numeric', month: 'long'})}</h3>
  ${a.map(c => `<label class="ch"><input type="checkbox" value="${c.id}" ${e.done.has(c.id) ? 'checked' : ''}>${chIcon(S.cats.find(k => k.id === c.category_id))}<span class="ct">${esc(c.title)}</span><b class="pt">+${fa(c.base_points)}</b></label>`).join('')}

}
async function sendEdit() {
  const ck = [...document.querySelectorAll('#main .ch input:checked')].map(i => i.value), d = S.edit.date;
  const {error} = await sb.rpc('request_day_edit', {p_ws: S.wid, p_date: d, p_done: ck});

async function saveProfile() {
  const keys = S.fields.map(f => f.field_key), reqMap = {}; S.fields.forEach(f => reqMap[f.field_key] = f.required);

  const {error} = await sb.rpc('update_member_profile', {p_ws: S.wid, p_profile: data});

async function changePin() {
  const pin = normD($('#p_pin').value);
  if (!/^\d{5}$/.test(pin)) return notify('رمز باید ۵ رقم باشد', false);
  const {error} = await sb.auth.updateUser({password: PW(pin)});
  notify(error ? error.message : 'رمز تغییر کرد ✅', !error);
}
async function leaveWs() {
  if (!confirm('از این لیگ خارج می‌شوید؟ سوابق شما باقی می‌ماند.')) return;
  const {error} = await sb.rpc('leave_workspace', {p_ws: S.wid});

  notify('از لیگ خارج شدید.'); boot();

const LEVEL_OK = () => {
  const top = topLevel(); const probs = [];
  if (!top) return ['هیچ چالشی تعریف نشده است'];
  for (let g = 1; g <= top; g++) {
    if (!lvlChallenges(g).length) probs.push(`سطح ${fa(g)} چالش فعال ندارد`);
    else if (g > 1 && lvlSum(g) !== lvlSum(1)) probs.push(`جمع امتیاز سطح ${fa(g)} (${fa(lvlSum(g))}) باید برابر سطح ۱ (${fa(lvlSum(1))}) باشد`);
  }
  return probs;
};

function levelEditorHtml() {
  const top = Math.max(1, topLevel()); let h = '';
  for (let L = 1; L <= top; L++) {
    const locked = L <= S.ws.levels_started;
    const list = S.ch.filter(c => c.level === L);
    h += `<div class="c" data-level="${L}" style="border-style:dashed"><h3>سطح ${fa(L)} ${locked ? '<span class="lock">🔒 شروع شده</span>' : ''}</h3>
      ${list.map(c => challengeRow(c, locked)).join('')}
      ${locked ? '' : `<button class="small" onclick="addChallenge(${L})">+ چالش</button>`}</div>`;
  }
  return h;
}
function challengeRow(c, locked) {
  const dis = locked ? 'disabled' : '';
  return `<div class="c ch-row" data-id="${c.id}" data-locked="${locked ? 1 : 0}" style="margin:6px 0">
    <div class="f">
      <label class="full">عنوان<input class="cf-t" value="${esc(c.title)}" ${dis}></label>
      <label>امتیاز<input class="cf-p" type="number" min="1" step="1" value="${c.base_points}" ${dis}></label>
      <label>دسته<select class="cf-k" ${dis}><option value="">بدون دسته</option>${S.cats.map(k => `<option value="${k.id}" ${k.id === c.category_id ? 'selected' : ''}>${esc(k.name)}</option>`).join('')}</select></label>
      <label class="full">توضیح<textarea class="cf-d" rows="2" ${dis}>${esc(c.description || '')}</textarea></label>
      <label class="full">لینک توضیح بیشتر (https)<input class="cf-l" dir="ltr" value="${esc(c.link || '')}" ${dis}></label>
    </div>
    <div class="row nob"><label><input type="checkbox" class="cf-a" style="width:auto" ${c.is_active ? 'checked' : ''} ${dis}> فعال</label>
    ${locked ? '<span class="lock">قفل</span>' : `<button class="small danger" onclick="this.closest('.ch-row').remove()">حذف</button>`}</div></div>`;
}
function addChallenge(L) {
  const box = document.querySelector(`[data-level="${L}"]`);
  box.insertAdjacentHTML('beforeend', challengeRow({id: '', title: '', base_points: 1, category_id: null, description: '', link: '', is_active: true}, false));
}
function addLevel() {
  const top = Math.max(1, document.querySelectorAll('[data-level]').length);
  $('#lv-editor').insertAdjacentHTML('beforeend', `<div class="c" data-level="${top + 1}" style="border-style:dashed"><h3>سطح ${fa(top + 1)}</h3>
    ${challengeRow({id: '', title: '', base_points: 1, category_id: null, description: '', link: '', is_active: true}, false)}
    <button class="small" onclick="addChallenge(${top + 1})">+ چالش</button></div>`);
}
async function saveLevels() {
  const items = []; let bad = null;
  document.querySelectorAll('[data-level]').forEach(box => {
    const L = +box.dataset.level;
    box.querySelectorAll('.ch-row').forEach(r => {
      const title = r.querySelector('.cf-t').value.trim();
      const pts = r.querySelector('.cf-p').value;
      if (!title && !r.dataset.id) return; // ردیف خالی جدید
      items.push({id: r.dataset.id || null, level: L, title, points: pts, category_id: r.querySelector('.cf-k').value || null,
        description: r.querySelector('.cf-d').value.trim() || null, link: r.querySelector('.cf-l').value.trim() || null,
        is_active: r.querySelector('.cf-a').checked});
    });
  });
  if (!items.length) return notify('حداقل یک چالش لازم است', false);
  if (items.some(i => !i.title)) return notify('عنوان همه چالش‌ها را وارد کنید', false);
  const {error} = await sb.rpc('save_challenges', {p_ws: S.wid, p_items: items});
  if (error) return notify(error.message, false);
  notify('چالش‌ها و سطح‌ها ذخیره شد ✅'); reload();
}
async function decideMember(uid, ok) {
  const {error} = await sb.rpc('approve_membership', {p_ws: S.wid, p_user: uid, p_ok: ok});
  notify(error ? error.message : ok ? 'عضو تایید شد ✅' : 'درخواست رد شد', !error); reload();
}
async function setRole(uid, role) {
  const {error} = await sb.rpc('set_member_role', {p_ws: S.wid, p_user: uid, p_role: role});
  notify(error ? error.message : 'نقش تغییر کرد ✅', !error); reload();
}
async function removeMem(uid) {
  if (!confirm('این عضو اخراج شود؟ سوابقش باقی می‌ماند.')) return;
  const {error} = await sb.rpc('remove_member', {p_ws: S.wid, p_user: uid});
  notify(error ? error.message : 'عضو اخراج شد', !error); reload();
}
async function decideEdit(id, ok) {
  const {error} = await sb.rpc('approve_day_edit', {p_id: id, p_ok: ok});
  notify(error ? error.message : ok ? 'ویرایش اعمال شد ✅' : 'درخواست رد شد', !error); reload();
}
async function makeInvite() {
  const d = normD($('#iv_d').value), m = normD($('#iv_m').value);
  const {data, error} = await sb.rpc('create_invite', {p_ws: S.wid, p_days: d ? +d : null, p_max: m ? +m : null});
  if (error) return notify(error.message, false);
  const o = $('#iv_out'); o.style.display = 'block'; o.value = `${location.origin}${location.pathname}?join=${data}`; o.select();
  notify('لینک دعوت ساخته شد ✅'); reload();
}
async function toggleInvite(token, revoked) {
  const {error} = await sb.rpc('set_invite_active', {p_token: token, p_active: !!revoked});
  notify(error ? error.message : 'لینک به‌روز شد ✅', !error); reload();
}
async function saveWs() {
  const v = {p_name: $('#ws_name').value.trim(), p_visibility: $('#ws_vis').value,
    p_bonus_enabled: $('#ws_bonus').value === 'true', p_bonus_percent: +normD($('#ws_bp').value),
    p_win_percent: +normD($('#ws_wp').value), p_auto_approve: $('#ws_auto').value === 'true',
    p_palette: {primary: $('#ws_c1').value, dark: $('#ws_c2').value}};
  if (!v.p_name) return notify('نام لیگ را وارد کنید', false);
  const {error} = await sb.rpc('update_workspace_settings', {p_ws: S.wid, ...v});
  notify(error ? error.message : 'تنظیمات ذخیره شد ✅', !error); reload();
}
async function saveFields() {
  const arr = FIELD_KEYS.map(k => ({key: k, required: $('#fr_' + k).checked, visible: $('#fv_' + k).checked}));
  const {error} = await sb.rpc('set_profile_fields', {p_ws: S.wid, p_fields: arr});
  notify(error ? error.message : 'فیلدها ذخیره شد ✅', !error); reload();
}
async function setLogo(inp) {
  const f = inp.files[0]; if (!f) return;
  try {
    const data = await resizeImg(f, 256, 'image/png');
    const {error} = await sb.from('workspaces').update({logo: data}).eq('id', S.wid);
    if (error) throw error;
    notify('لوگوی لیگ تغییر کرد ✅'); reload();
  } catch (e) { notify('لوگو ذخیره نشد: ' + (e.message || e), false); }
}
async function saveCat(id) {
  const isNew = id === 'new';
  const name = isNew ? $('#kn_new').value.trim() : S.cats.find(k => k.id === id)?.name;
  const color = isNew ? $('#kc_new').value : $('#kc_' + id).value;
  const f = $(isNew ? '#ki_new' : '#ki_' + id).files[0];
  if (!name) return notify('نام دسته را وارد کنید', false);
  let icon = isNew ? null : (S.cats.find(k => k.id === id)?.icon || null);
  if (f) icon = await resizeImg(f, 96, 'image/png');
  const row = {workspace_id: S.wid, name, color, icon};
  const {error} = isNew ? await sb.from('categories').insert(row) : await sb.from('categories').update({name, color, icon}).eq('id', id);
  notify(error ? error.message : 'دسته ذخیره شد ✅', !error); reload();
}
async function delCat(id) {
  if (!confirm('این دسته حذف شود؟ چالش‌های آن بدون دسته می‌شوند.')) return;
  const {error} = await sb.from('categories').delete().eq('id', id);
  notify(error ? error.message : 'دسته حذف شد', !error); reload();
}

boot().catch(e => showFatal(e.message || String(e)));
</script></body></html>
