<style>
:root{--bg:#f3f7f4;--card:#fff;--tx:#1d2a23;--mu:#6b7a72;--ac:#2f9e6b;--ac2:#1f7a52;--bd:#e3e9e4;--wait:#b7791f}
@media(prefers-color-scheme:dark){:root{--bg:#111815;--card:#1b2520;--tx:#e8eee9;--mu:#93a39a;--ac:#4fb68a;--ac2:#2f9e6b;--bd:#2b3731;--wait:#e0a84a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0 auto;font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--tx);padding:12px 12px 96px;max-width:640px;line-height:1.7}
h1{font-size:1.35em;margin:2px 0}h2{font-size:1.2em;margin:6px 0}h3{margin:4px 0 8px;font-size:1.05em}
.top{display:flex;align-items:center;gap:8px;margin:4px 2px 8px;font-weight:700}
.hero{background:linear-gradient(135deg,#1f7a52,#4fb68a);color:#fff;border-radius:18px;padding:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.mu2{opacity:.88;font-size:.85em}
.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 1px 3px #0000000a}
button,input,select,textarea{font:inherit;padding:10px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);max-width:100%}
input,select,textarea{width:100%}
button{cursor:pointer;transition:transform .12s,box-shadow .12s,opacity .2s}
button:active{transform:scale(.94)}
button.p{background:var(--ac);color:#fff;border:0;box-shadow:0 3px 0 var(--ac2)}
button.p:active{box-shadow:0 0 0 var(--ac2);transform:translateY(3px) scale(.98)}
button.big{width:100%;padding:14px;font-weight:700;font-size:1.05em}
button.ghost{background:#ffffff26;color:#fff;border:0}
button.ghost2{background:none;color:var(--tx)}
button.icon{width:42px;height:42px;padding:0;display:grid;place-items:center;border-radius:14px}
.busy{pointer-events:none;opacity:.85;position:relative;color:transparent!important}
.busy::after{content:"";position:absolute;inset:0;margin:auto;width:18px;height:18px;border:2.5px solid #fff;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.mu{color:var(--mu);font-size:.9em}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.ch{display:flex;align-items:center;gap:10px;padding:10px;border:1.5px solid var(--bd);border-radius:14px;margin:8px 0;cursor:pointer;transition:.15s}
.ch:has(input:checked){border-color:var(--ac);background:color-mix(in srgb,var(--ac) 10%,transparent)}
.ch input{appearance:none;-webkit-appearance:none;width:26px;height:26px;margin:0;padding:0;border-radius:50%;border:2px solid var(--bd);display:grid;place-items:center;flex:none}
.ch input:checked{background:var(--ac);border-color:var(--ac)}.ch input:checked::after{content:"✓";color:#fff;font-size:15px;line-height:1}
.ct{flex:1}.ct small{display:block;color:var(--mu)}.pt{color:var(--ac)}
.ib{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.chip{background:var(--bd);border-radius:20px;padding:3px 10px;margin-inline-end:6px;font-size:.85em;display:inline-block}
.sum{color:var(--ac)}
.stat{display:flex;gap:16px;align-items:center}.big2{font-size:1.5em;font-weight:700}.big2 small{font-size:.5em;color:var(--mu);font-weight:400}
.ring{width:76px;height:76px;border-radius:50%;flex:none;background:conic-gradient(var(--ac) calc(var(--p)*1%),var(--bd) 0);display:grid;place-items:center;position:relative}
.ring::before{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--card)}.ring b{position:relative;font-size:.9em}
.tabs{position:fixed;bottom:0;inset-inline:0;display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;font-size:.72em;color:var(--mu);padding:4px 6px}
.tabs .on{color:var(--ac);font-weight:700}
.toast{position:fixed;top:12px;inset-inline:12px;max-width:560px;margin:auto;z-index:9;padding:12px 14px;border-radius:12px;animation:fade 4.5s forwards;box-shadow:0 6px 20px #0003;pointer-events:none}
@keyframes fade{0%,85%{opacity:1}100%{opacity:0;visibility:hidden}}
.msg{padding:8px;border-radius:8px}.err{background:#fde8e8;color:#8a1f1f}.ok{background:#e3f4ea;color:#1b5e3b}
.badge{display:inline-block;border-radius:20px;padding:1px 10px;font-size:.8em;margin-top:2px}
.badge.wait{background:color-mix(in srgb,var(--wait) 22%,transparent);color:var(--wait);border:1px dashed var(--wait)}
.dwait{border-inline-start:4px solid var(--wait);padding-inline-start:10px}
.av{border-radius:50%;object-fit:cover;background:var(--bd);display:grid;place-items:center;font-weight:700;flex:none;overflow:hidden}
.f{display:grid;grid-template-columns:1fr 1fr;gap:8px}.f label{font-size:.85em;color:var(--mu);display:flex;flex-direction:column;gap:3px}.f .full{grid-column:1/-1}
.login{text-align:center;margin-top:5vh}.login .c{text-align:start}
.lnk{color:var(--ac);text-decoration:underline;cursor:pointer;font-weight:700}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.85em}td,th{padding:7px 5px;text-align:center;border-bottom:1px solid var(--bd);white-space:nowrap}
tr.me td{background:color-mix(in srgb,var(--ac) 12%,transparent);font-weight:700}
</style></head><body>
<div id="app"><div class="c">در حال بارگذاری…</div></div>

<script>
const SUPABASE_URL = "https://ekmiynpjugfqdnwfofgn.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVrbWl5bnBqdWdmcWRud2ZvZmduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzNjU1MTcsImV4cCI6MjEwNzk0MTUxN30.6i1LKuj9KUbJAJ916Yo7AOC-_VtftDpVhdDEeR8f5LA";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = s => document.querySelector(s);
const fa = n => Number(n).toLocaleString('fa-IR');
const DAY = 864e5, ms = s => Date.parse(s + 'T00:00:00Z'), str = m => new Date(m).toISOString().slice(0, 10);
const addDays = (s, n) => str(ms(s) + n * DAY);
const weekStart = s => addDays(s, -((new Date(ms(s)).getUTCDay() + 1) % 7));
const fd = (s, o) => new Date(ms(s)).toLocaleDateString('fa-IR', {timeZone: 'UTC', ...o});
const todayIn = tz => new Intl.DateTimeFormat('en-CA', {timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit'}).format(new Date());
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const normD = s => String(s ?? '').replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).trim();
const emailOf = ph => 'u' + ph + '@wecando.app';
const PW = pin => 'wcd-' + pin;
const CATS = ['تغذیه', 'فعالیت بدنی', 'آرامش روحی'];
const S = {tab: 'submit', edit: null, viewId: null, logo: null};

function notify(t, ok = true) {
  document.querySelectorAll('.busy').forEach(b => b.classList.remove('busy'));
  const d = document.createElement('div'); d.className = 'toast msg ' + (ok ? 'ok' : 'err'); d.textContent = t;
  document.body.appendChild(d); setTimeout(() => d.remove(), 4500);
}
// جلوگیری از کلیک دوباره و نشان‌دادن حالت در حال انجام
document.addEventListener('click', e => {
  const b = e.target.closest('button.p, button[data-b]');
  if (!b) return;
  if (b.classList.contains('busy')) { e.stopPropagation(); e.preventDefault(); return; }
  b.classList.add('busy'); setTimeout(() => b.classList.remove('busy'), 12000);
}, true);

const svg = (p, c = 'currentColor', n = 22) => `<svg width="${n}" height="${n}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICON = {
  'تغذیه': ['#2f9e6b', '<path d="M12 8c-2.5-2.5-7-1-7 4 0 4 3 8 7 8s7-4 7-8c0-5-4.5-6.5-7-4z"/><path d="M12 8c0-2.5 1-4 3.5-5"/>'],
  'فعالیت بدنی': ['#e8833a', '<path d="M3 12h4l3-8 4 16 3-8h4"/>'],
  'آرامش روحی': ['#7c5cc4', '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>']};
const chIcon = cat => { const [c, p] = ICON[cat] || ['#888', '']; return `<span class="ib" style="background:${c}22">${svg(p, c)}</span>`; };
const TABI = {
  submit: '<path d="M5 12l5 5L20 7"/>',
  board: '<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>',
  hist: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  profile: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>',
  admin: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'};

const DEF_LOGO = '<svg viewBox="0 0 64 64"><rect width="64" height="64" rx="18" fill="#2f9e6b"/><path d="M12 20 22 46 32 26 42 46 52 20" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const logo = (n = 40) => S.logo ? `<img src="${S.logo}" alt="" style="width:${n}px;height:${n}px;object-fit:contain">` : DEF_LOGO.replace('<svg ', `<svg width="${n}" height="${n}" `);
const av = (p, n = 56) => p.avatar
  ? `<img class="av" src="${p.avatar}" alt="" style="width:${n}px;height:${n}px">`
  : `<div class="av" style="width:${n}px;height:${n}px">${esc(((p.first_name || p.display_name || '؟')[0]))}</div>`;

function resizeImg(file, max = 256, type = 'image/jpeg') {
  return new Promise((res, rej) => {
    const r = new FileReader(); r.onerror = rej;
    r.onload = () => {
      const im = new Image(); im.onerror = rej;
      im.onload = () => {
        const k = Math.min(1, max / Math.max(im.width, im.height));
        const c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL(type, .85));
      };
      im.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

const active = pw => S.ch.filter(c => c.is_active && c.start_week <= pw);
const sum = a => a.reduce((s, c) => s + c.base_points, 0);
const thr = pw => { const t = sum(active(pw)); return Math.round((t + Math.round(t * .2)) * 7 * .8); };
function streakOf(d) {
  let i = S.today; if (!d[i]?.ok) i = addDays(i, -1);
  let n = 0; while (d[i]?.ok) { n++; i = addDays(i, -1); }
  return n;
}

/* ---------- ورود، ثبت‌نام، وضعیت ---------- */
async function boot() {
  const g = await sb.from('game_settings').select('tz,logo').single();
  if (!g.error) { S.tz = g.data.tz; S.logo = g.data.logo; }
  const {data: {session}} = await sb.auth.getSession();
  if (!session) return authView('login');
  const uid = session.user.id;
  const [p, ch, wk] = await Promise.all([
    sb.from('profiles').select('*').eq('id', uid).single(),
    sb.from('challenges').select('*').order('id'),
    sb.from('calendar_weeks').select('*').order('week_number')]);
  if (p.error || !p.data) { await sb.auth.signOut(); return authView('login'); }
  if (p.data.status !== 'active') { const pend = p.data.status === 'pending'; await sb.auth.signOut(); return pendingView(pend); }
  if (ch.error || wk.error) return notify('خطا در دریافت اطلاعات: ' + ((ch.error || wk.error).message), false);
  Object.assign(S, {uid, me: p.data, ch: ch.data, weeks: wk.data});
  S.today = todayIn(S.tz);
  const sub = await sb.from('submissions').select('challenge_id,completed').eq('member_id', uid).eq('activity_date', S.today);
  S.done = new Set((sub.data || []).filter(r => r.completed).map(r => r.challenge_id));
  S.saved = (sub.data || []).length > 0;
  render();
}
const load = boot;

let legacy = false;
const loginForm = () => legacy ? `<div class="f">
<label class="full">ایمیل<input id="e_mail" type="email" dir="ltr"></label>
<label class="full">رمز عبور<input id="e_pw" type="password" dir="ltr"></label></div>
<button class="p big" style="margin-top:12px" onclick="loginEmail()">ورود</button>
<button class="ghost2" style="width:100%;margin-top:8px" onclick="legacy=false;authView('login')">ورود با شماره موبایل</button>`
: `<div class="f">
<label class="full">شماره موبایل<input id="l_ph" inputmode="numeric" dir="ltr" placeholder="09121234567"></label>
<label class="full">رمز ۵ رقمی<input id="l_pin" type="password" inputmode="numeric" maxlength="5" dir="ltr"></label></div>
<button class="p big" style="margin-top:12px" onclick="login()">ورود</button>
<button class="ghost2" style="width:100%;margin-top:8px" onclick="legacy=true;authView('login')">ورود با ایمیل (حساب‌های قدیمی)</button>`;

const regForm = () => `<div class="f">
<label>نام<input id="r_first"></label>
<label>نام خانوادگی<input id="r_last"></label>
<label class="full">شماره موبایل<input id="r_ph" inputmode="numeric" dir="ltr" placeholder="09121234567"></label>
<label>جنسیت<select id="r_gender"><option value="">انتخاب کنید</option><option>مرد</option><option>زن</option></select></label>
<label>تاریخ تولد<input id="r_birth" type="date" dir="ltr"></label>
<label>قد (cm)<input id="r_height" type="number" inputmode="numeric" min="50" max="260" step="1"></label>
<label>وزن (kg)<input id="r_weight" type="number" inputmode="decimal" min="20" max="400" step="0.1"></label>
<label>رمز ۵ رقمی<input id="r_pin" type="password" inputmode="numeric" maxlength="5" dir="ltr"></label>
<label>تکرار رمز<input id="r_pin2" type="password" inputmode="numeric" maxlength="5" dir="ltr"></label>
<label class="full">درباره من<textarea id="r_bio" rows="3" maxlength="500"></textarea></label>
<label class="full">عکس پروفایل (اختیاری)<input id="r_img" type="file" accept="image/*"></label>
</div><button class="p big" style="margin-top:12px" onclick="register()">ثبت‌نام</button>
<p class="mu">رمز ۵ رقمی را با اعداد فارسی یا انگلیسی وارد کنید. پس از ثبت‌نام، مدیر باید آن را تایید کند.</p>`;

function authView(mode = 'login') {
  const reg = mode === 'register';
  $('#app').innerHTML = `<div class="login">
  <div style="margin:0 auto;width:76px">${logo(76)}</div>
  <h2 style="margin:6px 0 0">وی‌کن‌دو</h2><div class="mu">WeCanDo · ${reg ? 'ثبت‌نام عضو جدید' : 'ورود به لیگ'}</div>
  <div class="c">${reg ? regForm() : loginForm()}</div>
  <button class="ghost2" onclick="authView('${reg ? 'login' : 'register'}')">${reg ? 'حساب دارید؟ ورود' : 'عضو نیستید؟ ثبت‌نام'}</button></div>`;
}
function pendingView(pending) {
  $('#app').innerHTML = `<div class="login"><div style="margin:0 auto;width:76px">${logo(76)}</div>
  <div class="c"><h3>${pending ? 'در انتظار تایید مدیر' : 'ثبت‌نام شما تایید نشد'}</h3>
  <p class="mu">${pending ? 'پس از تایید مدیر می‌توانید وارد شوید.' : 'برای اطلاعات بیشتر با مدیر تماس بگیرید.'}</p>
  <button class="ghost2" onclick="authView('login')">بازگشت به ورود</button></div></div>`;
}
async function loginEmail() {
  const email = $('#e_mail').value.trim(), pw = $('#e_pw').value;
  if (!email || !pw) return notify('ایمیل و رمز عبور را وارد کنید', false);
  const {error} = await sb.auth.signInWithPassword({email, password: pw});
  if (error) return notify('ایمیل یا رمز عبور اشتباه است', false);
  boot();
}
async function login() {
  const ph = normD($('#l_ph').value), pin = normD($('#l_pin').value);
  if (!/^09\d{9}$/.test(ph) || !/^\d{5}$/.test(pin)) return notify('شماره موبایل یا رمز ۵ رقمی درست نیست', false);
  const {error} = await sb.auth.signInWithPassword({email: emailOf(ph), password: PW(pin)});
  if (error) return notify('شماره موبایل یا رمز ورود اشتباه است', false);
  boot();
}
async function register() {
  const v = {first: $('#r_first').value.trim(), last: $('#r_last').value.trim(), ph: normD($('#r_ph').value),
    gender: $('#r_gender').value, birth: $('#r_birth').value, height: normD($('#r_height').value),
    weight: normD($('#r_weight').value), pin: normD($('#r_pin').value), pin2: normD($('#r_pin2').value), bio: $('#r_bio').value.trim()};
  const errs = [];
  if (!v.first || !v.last) errs.push('نام و نام خانوادگی');
  if (!/^09\d{9}$/.test(v.ph)) errs.push('شماره موبایل (۰۹…)');
  if (!v.gender) errs.push('جنسیت');
  if (!v.birth) errs.push('تاریخ تولد');
  if (!(Number.isInteger(+v.height) && +v.height >= 50 && +v.height <= 260)) errs.push('قد (عدد صحیح بین ۵۰ و ۲۶۰)');
  if (!(+v.weight >= 20 && +v.weight <= 400)) errs.push('وزن');
  if (!/^\d{5}$/.test(v.pin)) errs.push('رمز ۵ رقمی');
  if (v.pin !== v.pin2) errs.push('تکرار رمز (با رمز یکی نیست)');
  if (!v.bio) errs.push('درباره من');
  if (errs.length) return notify('لطفاً این موارد را درست وارد کنید: ' + errs.join('، '), false);
  let avatar = null; const f = $('#r_img').files[0];
  if (f) { try { avatar = await resizeImg(f, 256); } catch (e) { return notify('عکس خوانده نشد', false); } }
  const {error} = await sb.auth.signUp({email: emailOf(v.ph), password: PW(v.pin), options: {data: {
    first_name: v.first, last_name: v.last, phone: v.ph, gender: v.gender, birth_date: v.birth,
    height_cm: Math.round(+v.height), weight_kg: +v.weight, bio: v.bio, avatar}}});
  if (error) return notify(/already/i.test(error.message) ? 'این شماره قبلاً ثبت‌نام کرده است' : 'ثبت‌نام انجام نشد: ' + error.message, false);
  await sb.auth.signOut();
  notify('ثبت‌نام انجام شد. پس از تایید مدیر می‌توانید وارد شوید.');
  authView('login');
}
async function logout() { await sb.auth.signOut(); S.me = null; authView('login'); }

/* ---------- قاب اصلی ---------- */
function render() {
  const tabs = [['submit', 'ثبت امروز'], ['board', 'لیگ'], ['hist', 'تاریخچه'], ['profile', 'پروفایل']];
  if (S.me.role === 'admin') tabs.push(['admin', 'مدیریت']);
  $('#app').innerHTML = `<div class="top">${logo(30)}<span>وی‌کن‌دو</span></div>
  <div class="hero"><div><div class="mu2">${fd(S.today, {weekday: 'long', day: 'numeric', month: 'long'})}</div>
  <h1>سلام ${esc(S.me.display_name)} 👋</h1><div class="mu2">چالش هفته ${fa(S.me.progress_week)}</div></div>
  <button class="ghost" data-b onclick="logout()">خروج</button></div>
  <div id="main"></div>
  <nav class="tabs">${tabs.map(([k, v]) => `<button class="${S.tab === k ? 'on' : ''}" onclick="go('${k}')">${svg(TABI[k])}<span>${v}</span></button>`).join('')}</nav>`;
  ({submit: submitView, board: boardView, hist: histView, profile: profileView, admin: adminView})[S.tab]();
}
function go(k) { S.tab = k; if (k !== 'profile') S.viewId = null; S.edit = null; render(); }
function openProfile(id) { S.viewId = id; go('profile'); }

/* ---------- ثبت امروز ---------- */
function submitView() {
  const a = active(S.me.progress_week);
  $('#main').innerHTML = `<div id="sum"></div><div class="c"><div class="mu">فعالیت‌های امروز <b>${fd(S.today, {weekday: 'long', day: 'numeric', month: 'long'})}</b></div>
  ${a.map(c => `<label class="ch"><input type="checkbox" value="${c.id}" ${S.done.has(c.id) ? 'checked' : ''} onchange="tot()">${chIcon(c.category)}<span class="ct">${esc(c.title)}<small>${c.category}</small></span><b class="pt">+${fa(c.base_points)}</b></label>`).join('')}
  <p id="tot"></p><button class="p big" onclick="save()">${S.saved ? 'بروزرسانی فعالیت امروز' : 'ثبت فعالیت امروز'}</button>
  <p class="mu">هر کاری را که امروز انجام می‌دهید همین‌جا ثبت کنید. برای تغییر روزهای گذشته از تب تاریخچه استفاده کنید.</p></div>`;
  tot(); summary();
}
function tot() {
  const a = active(S.me.progress_week), ck = [...document.querySelectorAll('.ch input:checked')].map(i => i.value);
  const done = a.filter(c => ck.includes(c.id)), base = sum(done), all = a.length && done.length === a.length;
  const bonus = all ? Math.round(sum(a) * .2) : 0;
  $('#tot').innerHTML = `<span class="chip">پایه ${fa(base)}</span><span class="chip">پاداش ${fa(bonus)}</span><b class="sum">مجموع ${fa(base + bonus)}</b>`;
}
async function summary() {
  const {data} = await sb.from('daily_scores').select('activity_date,daily_total,all_challenges_completed').eq('member_id', S.uid).gte('activity_date', addDays(S.today, -60));
  const d = {}; (data || []).forEach(r => d[r.activity_date] = {t: r.daily_total, ok: r.all_challenges_completed});
  const ws = weekStart(S.today); let score = 0;
  for (let i = 0; i < 7; i++) score += d[addDays(ws, i)]?.t || 0;
  const th = thr(S.me.progress_week), pct = th ? Math.min(100, Math.round(score / th * 100)) : 0;
  const el = $('#sum'); if (!el) return;
  el.innerHTML = `<div class="c stat"><div class="ring" style="--p:${pct}"><b>${fa(pct)}٪</b></div><div>
  <div class="mu">امتیاز این هفته</div><div class="big2">${fa(score)} <small>از حد نصاب ${fa(th)}</small></div>
  <div class="mu">🔥 روزهای کامل پیاپی: <b>${fa(streakOf(d))}</b></div></div></div>`;
}
async function save() {
  const ck = [...document.querySelectorAll('.ch input:checked')].map(i => i.value);
  const {error} = await sb.rpc('submit_today', {p_done: ck});
  if (error) return notify('ثبت انجام نشد: ' + error.message, false);
  const a = active(S.me.progress_week), all = a.length && a.every(c => ck.includes(c.id));
  notify(all ? 'عالی! امروز همه چالش‌ها کامل شد و پاداش گرفتید 🎉' : 'ثبت شد ✅');
  boot();
}

/* ---------- لیگ ---------- */
async function boardView() {
  const {data, error} = await sb.rpc('get_scores', {p_from: addDays(S.today, -60)});
  if (error) return $('#main').innerHTML = `<div class="msg err">${esc(error.message)}</div>`;
  const ws = weekStart(S.today), days = [...Array(7)].map((_, i) => addDays(ws, i)), by = {};
  data.forEach(r => {
    (by[r.member_id] ??= {id: r.member_id, name: r.name, pw: r.progress_week, d: {}});
    if (r.activity_date) by[r.member_id].d[r.activity_date] = {t: r.daily_total, ok: r.all_completed};
  });
  const rows = Object.values(by).map(m => {
    const score = days.reduce((s, x) => s + (m.d[x]?.t || 0), 0);
    return {...m, score, streak: streakOf(m.d), ok: score >= thr(m.pw)};
  }).sort((a, b) => b.score - a.score);
  rows.forEach((r, i) => r.rank = i && r.score === rows[i - 1].score ? rows[i - 1].rank : i + 1);
  const wn = S.weeks.find(w => w.start_date === ws);
  $('#main').innerHTML = `<div class="c">
  <div class="row" style="border:0;padding:0"><div><h3 style="margin:0">جدول لیگ وی‌کن‌دو</h3><div class="mu">چالش هفته ${wn ? fa(wn.week_number) : '—'}</div></div>
  <button class="icon" onclick="boardView()" title="به‌روزرسانی" aria-label="به‌روزرسانی">${svg('<path d="M21 12a9 9 0 1 1-2.6-6.3M21 4v5h-5"/>')}</button></div>
  <div class="w" style="margin-top:10px"><table><tr><th>رتبه</th><th>نام</th>${days.map(d => `<th>${fd(d, {weekday: 'short'})}</th>`).join('')}<th>جمع</th><th>🔥</th><th>وضعیت</th></tr>
  ${rows.map(r => `<tr class="${r.id === S.uid ? 'me' : ''}"><td>${['🥇', '🥈', '🥉'][r.rank - 1] || fa(r.rank)}</td>
  <td><span class="lnk" onclick="openProfile('${r.id}')">${esc(r.name)}</span></td>
  ${days.map(d => `<td>${r.d[d] ? fa(r.d[d].t) : ''}</td>`).join('')}<td><b>${fa(r.score)}</b></td><td>${fa(r.streak)}</td>
  <td>${r.ok ? 'حد نصاب تکمیل شد' : 'در حال پیشرفت'}</td></tr>`).join('')}</table></div></div>`;
}

/* ---------- تاریخچه و ویرایش روزهای گذشته ---------- */
async function histView() {
  const m = $('#main'), first = S.weeks[0].start_date, days = [];
  for (let d = addDays(S.today, -1); d >= first && days.length < 21; d = addDays(d, -1)) days.push(d);
  const [sc, pend, wk] = await Promise.all([
    sb.from('daily_scores').select('activity_date,daily_total,all_challenges_completed').eq('member_id', S.uid).gte('activity_date', first),
    sb.from('day_edit_requests').select('activity_date').eq('member_id', S.uid).eq('status', 'pending'),
    sb.from('weekly_results').select('*').eq('member_id', S.uid).order('calendar_week_id', {ascending: false})]);
  const sMap = {}; (sc.data || []).forEach(r => sMap[r.activity_date] = r);
  const pSet = new Set((pend.data || []).map(r => r.activity_date));
  m.innerHTML = (S.edit ? editCard() : '') + `<div class="c"><h3>روزهای گذشته</h3>
  <p class="mu">برای ویرایش روی «ویرایش» بزنید. تغییرات پس از تایید مدیر اعمال می‌شوند.</p>
  ${days.length ? days.map(d => {
    const r = sMap[d], waiting = pSet.has(d);
    return `<div class="row ${waiting ? 'dwait' : ''}"><div><div>${fd(d, {weekday: 'long', day: 'numeric', month: 'long'})}</div>
    ${waiting ? '<span class="badge wait">در حال تایید</span>' : ''}</div>
    <div style="text-align:end"><div>${r ? `<b>${fa(r.daily_total)}</b> امتیاز${r.all_challenges_completed ? ' ✅' : ''}` : '<span class="mu">ثبت نشده</span>'}</div>
    <button class="ghost2" onclick="startEdit('${d}')">ویرایش</button></div></div>`;
  }).join('') : '<p class="mu">هنوز روز گذشته‌ای در بازی نیست.</p>'}</div>
  ${(wk.data || []).length ? `<div class="c"><h3>نتیجه چالش هفته‌ها</h3>${wk.data.map(r => `<div class="row"><span>چالش هفته ${fa(r.progress_week)}</span>
  <span class="mu">${fa(r.total_score)} از ${fa(r.weekly_threshold)} — ${esc(r.result_status)}</span></div>`).join('')}</div>` : ''}`;
}
async function startEdit(d) {
  const {data} = await sb.from('submissions').select('challenge_id,completed').eq('member_id', S.uid).eq('activity_date', d);
  S.edit = {date: d, done: new Set((data || []).filter(r => r.completed).map(r => r.challenge_id))};
  histView(); window.scrollTo(0, 0);
}
function editCard() {
  const e = S.edit, a = active(S.me.progress_week);
  return `<div class="c" style="border-color:var(--ac)"><h3>ویرایش ${fd(e.date, {weekday: 'long', day: 'numeric', month: 'long'})}</h3>
  ${a.map(c => `<label class="ch"><input type="checkbox" value="${c.id}" ${e.done.has(c.id) ? 'checked' : ''}>${chIcon(c.category)}<span class="ct">${esc(c.title)}<small>${c.category}</small></span><b class="pt">+${fa(c.base_points)}</b></label>`).join('')}
  <button class="p big" onclick="sendEdit()">ارسال درخواست ویرایش</button>
  <button class="ghost2" style="width:100%;margin-top:6px" onclick="S.edit=null;histView()">انصراف</button>
  <p class="mu">این تغییر فوراً اعمال نمی‌شود و برای تایید به مدیر فرستاده می‌شود.</p></div>`;
}
async function sendEdit() {
  const ck = [...document.querySelectorAll('#main .ch input:checked')].map(i => i.value), d = S.edit.date;
  const {error} = await sb.rpc('request_day_edit', {p_date: d, p_done: ck});
  if (error) return notify('ارسال نشد: ' + error.message, false);
  S.edit = null;
  notify(`درخواست ویرایش روز ${fd(d, {weekday: 'long', day: 'numeric', month: 'long'})} برای مدیر ارسال شد و پس از تایید اعمال خواهد شد.`);
  histView();
}

/* ---------- پروفایل ---------- */
async function profileView() {
  const id = S.viewId || S.uid, mine = id === S.uid, m = $('#main');
  const {data: p, error} = await sb.rpc('get_member_profile', {p_id: id});
  if (error || !p) return m.innerHTML = `<div class="c">${error ? esc(error.message) : 'این عضو پیدا نشد.'}</div>`;
  const head = `<div class="c" style="text-align:center">${av(p, 96)}
  <h2 style="margin:8px 0 2px">${esc(p.first_name || '')} ${esc(p.last_name || '')}</h2>
  <div><span class="chip">چالش هفته ${fa(p.progress_week)}</span></div><p>${esc(p.bio || '')}</p>`;
  if (!mine) return m.innerHTML = head + `<button onclick="go('board')">بازگشت به لیگ</button></div>`;
  m.innerHTML = head + `<div class="mu" dir="ltr">${esc(S.me.phone || '')}</div></div>
  <div class="c"><h3>ویرایش اطلاعات</h3><div class="f">
  <label>نام<input id="p_first" value="${esc(p.first_name)}"></label>
  <label>نام خانوادگی<input id="p_last" value="${esc(p.last_name)}"></label>
  <label>جنسیت<select id="p_gender"><option ${p.gender === 'مرد' ? 'selected' : ''}>مرد</option><option ${p.gender === 'زن' ? 'selected' : ''}>زن</option></select></label>
  <label>تاریخ تولد<input id="p_birth" type="date" dir="ltr" value="${esc(p.birth_date)}"></label>
  <label>قد (cm)<input id="p_height" type="number" step="1" value="${esc(p.height_cm)}"></label>
  <label>وزن (kg)<input id="p_weight" type="number" step="0.1" value="${esc(p.weight_kg)}"></label>
  <label class="full">درباره من<textarea id="p_bio" rows="3" maxlength="500">${esc(p.bio)}</textarea></label>
  <label class="full">عکس جدید (اختیاری)<input id="p_img" type="file" accept="image/*"></label>
  <label class="full">رمز جدید ۵ رقمی (اختیاری)<input id="p_pin" type="password" inputmode="numeric" maxlength="5" dir="ltr"></label>
  </div><button class="p big" style="margin-top:12px" onclick="saveProfile()">ذخیره تغییرات</button>
  <p class="mu">شماره موبایل برای ورود است و قابل تغییر نیست.</p></div>`;
}
async function saveProfile() {
  const v = {first: $('#p_first').value.trim(), last: $('#p_last').value.trim(), gender: $('#p_gender').value,
    birth: $('#p_birth').value, height: normD($('#p_height').value), weight: normD($('#p_weight').value),
    bio: $('#p_bio').value.trim(), pin: normD($('#p_pin').value)};
  if (!v.first || !v.last) return notify('نام و نام خانوادگی لازم است', false);
  if (!v.birth) return notify('تاریخ تولد را وارد کنید', false);
  if (!(Number.isInteger(+v.height) && +v.height >= 50 && +v.height <= 260)) return notify('قد معتبر نیست', false);
  if (!(+v.weight >= 20 && +v.weight <= 400)) return notify('وزن معتبر نیست', false);
  if (!v.bio) return notify('بخش درباره من خالی است', false);
  if (v.pin && !/^\d{5}$/.test(v.pin)) return notify('رمز باید ۵ رقمی باشد', false);
  let avatar = null; const f = $('#p_img').files[0];
  if (f) avatar = await resizeImg(f, 256);
  const {error} = await sb.rpc('update_profile', {p_first: v.first, p_last: v.last, p_gender: v.gender, p_birth: v.birth,
    p_height: Math.round(+v.height), p_weight: +v.weight, p_bio: v.bio, p_avatar: avatar});
  if (error) return notify('ذخیره نشد: ' + error.message, false);
  if (v.pin) {
    const {error: e2} = await sb.auth.updateUser({password: PW(v.pin)});
    if (e2) return notify('اطلاعات ذخیره شد ولی رمز عوض نشد: ' + e2.message, false);
  }
  notify('ذخیره شد ✅'); boot();
}

/* ---------- مدیریت ---------- */
async function adminView() {
  const [pm, de, pr] = await Promise.all([
    sb.from('profiles').select('*').eq('status', 'pending').order('created_at'),
    sb.from('day_edit_requests').select('*').eq('status', 'pending').order('created_at'),
    sb.from('profiles').select('id,display_name')]);
  const names = {}; (pr.data || []).forEach(p => names[p.id] = p.display_name);
  const pendM = pm.data || [], pendD = de.data || [];
  const closable = S.weeks.filter(w => w.status !== 'closed' && w.end_date < S.today);
  $('#main').innerHTML = `
  <div class="c"><h3>تایید ثبت‌نام (${fa(pendM.length)})</h3>
  ${pendM.length ? pendM.map(p => `<div class="c" style="margin:8px 0">
    <div class="row" style="border:0;padding:0;justify-content:flex-start">${av(p, 48)}<div><b>${esc(p.first_name)} ${esc(p.last_name)}</b><div class="mu" dir="ltr">${esc(p.phone)}</div></div></div>
    <div class="mu">${esc(p.gender)} · ${p.birth_date ? fd(p.birth_date, {year: 'numeric', month: 'long', day: 'numeric'}) : ''} · قد ${esc(p.height_cm)} · وزن ${esc(p.weight_kg)}</div>
    <p>${esc(p.bio)}</p>
    <div style="display:flex;gap:8px"><button class="p" onclick="decideMember('${p.id}',true)">تایید</button><button onclick="decideMember('${p.id}',false)">رد</button></div></div>`).join('')
    : '<p class="mu">ثبت‌نام جدیدی منتظر تایید نیست.</p>'}</div>
  <div class="c"><h3>درخواست ویرایش روزها (${fa(pendD.length)})</h3>
  ${pendD.length ? pendD.map(r => `<div class="row" style="align-items:flex-start">
    <div><b>${esc(names[r.member_id] || '—')}</b><div class="mu">${fd(r.activity_date, {weekday: 'long', day: 'numeric', month: 'long'})}</div>
    <div class="mu">پیشنهاد: ${(r.proposed_done || []).map(id => S.ch.find(c => c.id === id)?.title).filter(Boolean).map(esc).join('، ') || 'هیچ‌کدام'}</div></div>
    <div style="display:flex;gap:6px"><button class="p" onclick="decideEdit(${r.id},true)">تایید</button><button onclick="decideEdit(${r.id},false)">رد</button></div></div>`).join('')
    : '<p class="mu">درخواستی نیست.</p>'}</div>
  <div class="c"><h3>لوگو</h3><div class="row" style="border:0;justify-content:flex-start">${logo(56)}
  <input type="file" accept="image/*" onchange="setLogo(this)" style="width:auto"></div></div>
  <div class="c"><h3>چالش‌ها</h3><p class="mu">«چالش هفته شروع» یعنی: این چالش برای اعضایی فعال می‌شود که به همان چالش هفته برسند. تغییر امتیاز یا غیرفعال‌کردن وسط هفته حد نصاب را عوض می‌کند؛ بهتر است بین هفته‌ها انجام شود.</p></div>
  ${S.ch.map(chRow).join('')}
  <div class="c"><h3>چالش جدید</h3>
  <input id="ct_new" placeholder="عنوان چالش" style="margin-bottom:6px">
  <div class="f"><label>دسته<select id="ck_new">${CATS.map(k => `<option>${k}</option>`).join('')}</select></label>
  <label>امتیاز<input id="cp_new" type="number" min="1"></label>
  <label class="full">چالش هفته شروع<input id="cs_new" type="number" min="1"></label></div>
  <button class="p big" style="margin-top:10px" onclick="addCh()">افزودن</button></div>
  <div class="c"><h3>بستن چالش هفته و ارتقا</h3>
  ${closable.length ? `<select id="cw" style="margin-bottom:8px">${closable.map(w => `<option value="${w.id}">چالش هفته ${fa(w.week_number)} (${fd(w.start_date, {day: 'numeric', month: 'long'})})</option>`).join('')}</select>
  <button class="p" onclick="closeWeek()">بستن هفته</button>` : '<p class="mu">هفته‌ای که تمام شده و بسته نشده باشد وجود ندارد.</p>'}</div>`;
}
async function decideMember(id, ok) {
  const {error} = await sb.rpc('approve_member', {p_id: id, p_ok: ok});
  notify(error ? error.message : ok ? 'عضو تایید شد ✅' : 'ثبت‌نام رد شد', !error); adminView();
}
async function decideEdit(id, ok) {
  const {error} = await sb.rpc('approve_day_edit', {p_id: id, p_ok: ok});
  notify(error ? error.message : ok ? 'ویرایش اعمال شد ✅' : 'درخواست رد شد', !error); adminView();
}
async function setLogo(inp) {
  const f = inp.files[0]; if (!f) return;
  try {
    const data = await resizeImg(f, 256, 'image/png');
    const {error} = await sb.from('game_settings').update({logo: data}).eq('id', 1);
    if (error) throw error;
    notify('لوگو تغییر کرد ✅'); boot();
  } catch (e) { notify('لوگو ذخیره نشد: ' + (e.message || e), false); }
}
function chRow(c) {
  return `<div class="c"><div class="row" style="border:0;padding:0;justify-content:flex-start">${chIcon(c.category)}<input id="ct_${c.id}" value="${esc(c.title)}"></div>
  <div class="f" style="margin-top:6px"><label>دسته<select id="ck_${c.id}">${CATS.map(k => `<option ${k === c.category ? 'selected' : ''}>${k}</option>`).join('')}</select></label>
  <label>امتیاز<input id="cp_${c.id}" type="number" min="1" value="${esc(c.base_points)}"></label>
  <label class="full">چالش هفته شروع<input id="cs_${c.id}" type="number" min="1" value="${esc(c.start_week)}"></label></div>
  <div class="row" style="border:0"><label><input type="checkbox" id="ca_${c.id}" style="width:auto" ${c.is_active ? 'checked' : ''}> فعال</label>
  <button class="p" onclick="saveCh('${c.id}')">ذخیره</button></div></div>`;
}
function chRead(id) {
  const pts = Math.round(+$('#cp_' + id).value), sw = Math.round(+$('#cs_' + id).value), t = $('#ct_' + id).value.trim();
  if (!t || pts < 1 || sw < 1) return null;
  return {title: t, category: $('#ck_' + id).value, base_points: pts, start_week: sw};
}
async function saveCh(id) {
  const v = chRead(id); if (!v) return notify('عنوان، امتیاز و چالش هفته شروع را درست وارد کنید', false);
  const {error} = await sb.from('challenges').update({...v, is_active: $('#ca_' + id).checked, updated_at: new Date().toISOString()}).eq('id', id);
  notify(error ? error.message : 'ذخیره شد ✅', !error); boot();
}
async function addCh() {
  const v = chRead('new'); if (!v) return notify('عنوان، امتیاز و چالش هفته شروع را درست وارد کنید', false);
  const n = Math.max(0, ...S.ch.map(c => parseInt(c.id.slice(1)) || 0)) + 1;
  const {error} = await sb.from('challenges').insert({id: 'C' + String(n).padStart(3, '0'), ...v});
  notify(error ? error.message : 'چالش اضافه شد ✅', !error); boot();
}
async function closeWeek() {
  const {error} = await sb.rpc('close_week', {p_week: +$('#cw').value});
  notify(error ? error.message : 'چالش هفته بسته شد و ارتقاها اعمال شد.', !error); boot();
}

boot();
</script></body></html>
